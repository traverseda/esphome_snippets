# ---------------------------------------------------------------------------
# Waveshare ESP32-S3 audio board as a Home Assistant voice satellite.
#
# This is a PACKAGE. Your device config supplies esphome: name:, the wifi
# credentials, api: encryption:, and ota:; this file supplies the audio
# hardware, voice assistant, LED ring, timers and alarm.
#
#   packages:
#     speaker: github://traverseda/esphome_snippets/smart-speak.yaml@main
#
# Your config MUST keep these ids, which this package's scripts reference:
#   wifi:  id: wifi_id      (control_leds reads the connection state)
#   api:   id: api_id       (same)
# The api: block here also defines actions and client-connect handlers, so
# merge into it rather than replacing it.
#
# Requires ESPHome 2026.7.0+ and the esp-idf framework. The audio path is built
# on the esphome-audio-stack external component rather than ESPHome's own
# i2s_audio, so that AEC can run against the board's hardware echo reference -
# see the audio section below. That component is young; pin this package to a
# tag rather than tracking main if you care about reproducible builds.
# ---------------------------------------------------------------------------

# The BLE beacon proxy used to be pulled in here. It cannot coexist with the
# AEC front end on this chip - not for want of PSRAM, but because the I2S TDM
# DMA descriptors are the last thing allocated and can only live in internal
# DMA-capable memory. Bluedroid takes about 134 KB of internal RAM, which left
# 21 KB free and a 13 KB largest block against the ~41 KB of TX+RX descriptors
# the 4-slot TDM frame needs; I2S init failed with ESP_ERR_NO_MEM and both
# audio directions latched into an error state.
#
# Beacons therefore need to come from a device that is not also doing voice.
# ble-beacon-proxy.yaml is unchanged and still works on its own.

substitutions:
  # Phases of the Voice Assistant
  voice_assist_idle_phase_id: '1' # ready to be triggered by a wake word
  voice_assist_waiting_for_command_phase_id: '2' # waiting for a voice command (after being triggered by the wake word)
  voice_assist_listening_for_command_phase_id: '3' # listening for a voice command
  voice_assist_thinking_phase_id: '4' # processing the command
  voice_assist_replying_phase_id: '5' # replying to the command
  voice_assist_not_ready_phase_id: '10' # not ready
  voice_assist_error_phase_id: '11' #encountered an error

  i2s_mclk: GPIO12
  i2s_bclk: GPIO13 #SCLK
  i2s_lrclk: GPIO14 #LRCK/WS

  amp_ctrl: 8 #Extended IO pin that controls the PA_EN on the TCA9555
  i2c_scl: GPIO10
  i2c_sda: GPIO11
  rtc_int: 5 #ExtendedIO

  # The mic-channel lookup, the per-bus i2s_mode/bps/apll/mclk knobs and
  # which_mic are all gone: esp_audio_stack owns the bus and the codecs now, and
  # takes its rates and slot layout from its own block below.

  led_num: '7' # WS2812 ring leds

  # How long an announcement may sit in ANNOUNCING without a single decoded
  # sample before the watchdog gives up on it. Keep this above 30s: a slow
  # header fetch is retried six times at 5s each before the reader errors, and
  # audio that does eventually arrive should never be cut off.
  stalled_announcement_ms: '35000'

esphome:
  # esp_audio_stack is released against the 2026.7 component API.
  min_version: 2026.7.0
  on_boot:
    - priority: -100
      then:
        - if:
            condition:
              switch.is_on: diag_disable_mic
            then:
              - logger.log: "Mic ENABLED"
            else:
              - logger.log: "Mic DISABLED for diagnostics"
              - micro_wake_word.stop:
              - voice_assistant.stop:
              - microphone.stop_capture: clean_mic
    - priority: 375
      then:
        - sensor.template.publish:
            id: next_timer
            state: -1
        - script.execute: control_leds
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: control_leds
    - priority: -100
      then:
        - lambda: |-
            id(alarm_time).publish_state(id(saved_alarm_time));
        - lambda: |-
            auto call = id(alarm_action).make_call();
            call.set_option(id(saved_alarm_action));
            call.perform();
        - lambda: |-
            setenv("TZ", id(saved_time_zone).c_str(), 1);
            tzset();
        # Seed the system clock from the onboard RTC before HA is reachable, so
        # the alarm survives an HA restart. Runs after the TZ restore above so
        # the first published time is already local. With no backup cell the
        # chip's oscillator-stop flag is set after a power cut and the component
        # declines to sync, leaving HA the only source - i.e. today's behaviour.
        - pcf85063.read_time: hw_rtc
        - script.execute: publish_current_time

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      # Kept even though the BLE package is gone: harmless with Bluetooth
      # disabled, and it means re-adding a BLE package later does not silently
      # revert to allocating Bluedroid's environment from internal RAM.
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y" # TLS1.3 support isn't enabled by default in IDF 5.1.5

psram:
  mode: octal
  speed: 80MHz

# Sendspin hub, plus its media_source. Still not wired to a speaker/media_player
# yet - that is the next step. See esphome.io/components/sendspin/ - ESP32-only,
# needs mDNS and TCP 8928 reachable to the Sendspin server.
sendspin:
  id: sendspin_hub

media_source:
  - platform: sendspin
    id: sendspin_media_source

# Credentials (and the fallback ap:) come from your own config; this block
# only claims the id the LED scripts read and the connection-state triggers.
wifi:
  id: wifi_id
  power_save_mode: none # Disable power saving for better performance
  reboot_timeout: 10min # Prevent unnecessary reboots
  on_connect:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds
  on_disconnect:
    - script.execute: control_leds

# This interval drives the debug sensors below, not just the log line - at 5s
# they'd write seven states a minute each into HA's recorder for no benefit.
debug:
  update_interval: 60s

logger:
  level: DEBUG

# encryption: key: comes from your own config and merges into this block.
api:
  id: api_id
  actions:
    - action: set_led_color
      variables:
        red: float
        green: float
        blue: float
      then:
        - lambda: |-
            id(led_ring_color_r) = std::min(1.0f, std::max(0.0f, red));
            id(led_ring_color_g) = std::min(1.0f, std::max(0.0f, green));
            id(led_ring_color_b) = std::min(1.0f, std::max(0.0f, blue));
    - action: start_va
      then:
        - voice_assistant.start
    - action: stop_va
      then:
        - voice_assistant.stop
    - action: set_alarm_time
      variables:
        alarm_time_hh_mm: string
      then:
        - lambda: |-
            if (alarm_time_hh_mm.length() == 5 &&
              isdigit(alarm_time_hh_mm[0]) && isdigit(alarm_time_hh_mm[1]) &&
              isdigit(alarm_time_hh_mm[3]) && isdigit(alarm_time_hh_mm[4])) {
                id(alarm_time).publish_state(alarm_time_hh_mm);
                id(saved_alarm_time) = alarm_time_hh_mm;
              }
    - action: set_time_zone
      variables:
        posix_time_zone: string
      then:
        - lambda: |-
            setenv("TZ", posix_time_zone.c_str(), 1);
            tzset();
            id(saved_time_zone) = posix_time_zone;
            id(publish_current_time).execute();
  on_client_connected:
    - script.execute: control_leds
  on_client_disconnected:
    - script.execute: control_leds

i2c:
  - id: internal_i2c
    sda: GPIO11
    scl: GPIO10
    scan: true
    frequency: 100kHz

# I/O Expander that controls the amplifier enable pin
tca9555:
  id: ioexp
  i2c_id: internal_i2c
  address: 0x20

time:
  - platform: homeassistant
    id: rtc
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - script.execute: check_alarm
    on_time_sync:
      - script.execute: publish_current_time
      # HA stays authoritative; push its time down so the chip is correct for
      # the next cold boot. Declines to write if system time is itself invalid.
      - pcf85063.write_time:
          id: hw_rtc

  # Onboard PCF85063 (I2C 0x51), kept as a fallback rather than a peer:
  # update_interval: never, because polling would let the chip's drift overwrite
  # HA's accurate time every 15 minutes. Read once at boot, written on HA sync.
  # Absent or unreadable, it marks itself failed and nothing else is affected.
  - platform: pcf85063
    id: hw_rtc
    i2c_id: internal_i2c
    address: 0x51
    update_interval: never

light:
  - platform: esp32_rmt_led_strip
    id: status_ring
    name: "Status Ring"
    pin: GPIO38
    num_leds: ${led_num}
    chipset: WS2812
    rgb_order: RGB
    default_transition_length: 150ms
    effects:
      - pulse:
          name: "Pulse Slow"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 2000ms
          update_interval: 3000ms
      - pulse:
          name: "Pulse Medium"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 600ms
          update_interval: 1200ms
      - pulse:
          name: "Pulse Fast"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 300ms
          update_interval: 600ms
      - addressable_rainbow:
          name: "Rainbow Slow"
          speed: 6
          width: 7
      - addressable_color_wipe:
          name: "Wipe"
      # A single lit pixel chasing around the ring with a short fading tail.
      # Rotation reads as "busy" at a glance, which no pulse speed does.
      - addressable_lambda:
          name: "Comet"
          update_interval: 70ms
          lambda: |-
            static int head = 0;
            if (initial_run) head = 0;
            const int n = it.size();
            for (int i = 0; i < n; i++) {
              const int behind = (head - i + n) % n;  // 0 at the head
              float level;
              switch (behind) {
                case 0: level = 1.00f; break;
                case 1: level = 0.40f; break;
                case 2: level = 0.12f; break;
                default: level = 0.02f; break;
              }
              it[i] = Color((uint8_t) (current_color.red * level),
                            (uint8_t) (current_color.green * level),
                            (uint8_t) (current_color.blue * level));
            }
            head = (head + 1) % n;
      # A VU-style bar that grows around the ring with how loud the speaker is
      # playing. Reads TDM slot 1, the AEC reference tap wired to the ES8311's
      # output (see the esp_audio_stack block below) - an electrical copy of
      # what is being played, not a microphone, so it is unaffected by room
      # acoustics or how loud the mics happen to be. -60/-19 dBFS are this
      # board's measured idle/playing figures for that slot, same numbers the
      # tdm_slot_levels sensors below are commented against.
      #
      # get_tdm_slot_level_dbfs() is a lock-free atomic read updated by the
      # audio task on every RX frame (divided by 8, so a few times a second),
      # independent of whether any tdm_slot_levels sensor is enabled or the
      # "Debug: audio diagnostics" switch is on - both only gate what gets
      # published to HA, not whether the level itself is computed.
      - addressable_lambda:
          name: "Sound Reactive"
          update_interval: 60ms
          lambda: |-
            static float level = 0.0f;
            if (initial_run) level = 0.0f;
            float target = (id(audio_stack).get_tdm_slot_level_dbfs(1) + 60.0f) / 45.0f;
            if (target < 0.0f) target = 0.0f;
            if (target > 1.0f) target = 1.0f;
            level += (target - level) * 0.3f;  // one-pole smoothing so it doesn't strobe frame to frame
            const int n = it.size();
            const float lit = level * n;
            for (int i = 0; i < n; i++) {
              float b;
              if (i < (int) lit) b = 1.0f;
              else if (i == (int) lit) b = lit - (int) lit;  // partial pixel at the boundary
              else b = 0.05f;  // faint so the ring outline stays visible when quiet
              it[i] = Color((uint8_t) (current_color.red * b),
                            (uint8_t) (current_color.green * b),
                            (uint8_t) (current_color.blue * b));
            }
      # Same VU bar, but for the room instead of the speaker: averages TDM
      # slots 0 and 2 (MIC1/MIC2, the two array mics - see esp_audio_stack
      # below). Floor/ceiling here are a starting guess, not measured like the
      # playback tap's - retune against "Diag: TDM slot 0/2" with "Debug:
      # audio diagnostics" on if this reads too hot or too flat in your room.
      - addressable_lambda:
          name: "Mic Reactive"
          update_interval: 60ms
          lambda: |-
            static float level = 0.0f;
            if (initial_run) level = 0.0f;
            const float dbfs = (id(audio_stack).get_tdm_slot_level_dbfs(0) +
                                 id(audio_stack).get_tdm_slot_level_dbfs(2)) / 2.0f;
            float target = (dbfs + 55.0f) / 35.0f;
            if (target < 0.0f) target = 0.0f;
            if (target > 1.0f) target = 1.0f;
            level += (target - level) * 0.3f;
            const int n = it.size();
            const float lit = level * n;
            for (int i = 0; i < n; i++) {
              float b;
              if (i < (int) lit) b = 1.0f;
              else if (i == (int) lit) b = lit - (int) lit;
              else b = 0.05f;
              it[i] = Color((uint8_t) (current_color.red * b),
                            (uint8_t) (current_color.green * b),
                            (uint8_t) (current_color.blue * b));
            }

# ---------------------------------------------------------------------------
# Audio path: ESP-SR front end over a 4-slot TDM capture.
#
# The board's ES7210 is a four-channel ADC, and the schematic wires it as:
#   ch1 (slot 0) MIC1_P/N      - left array mic
#   ch2 (slot 1) MIC2_P/N      - right array mic
#   ch3 (slot 2) ADC_MIC3_P/N  - the block marked AEC: the ES8311's OUTP/OUTN
#                                fed back through a divider, i.e. an electrical
#                                copy of what the speaker is playing
#   ch4 (slot 3) ADC_MIC4_P/N  - coupling caps only, nothing drives it
#
# Reading slot 2 alongside the mics is what lets ESP-SR subtract the playback
# from the capture, so the wake word survives music and TTS. The old config read
# a plain stereo I2S frame and took the left channel only, which threw away both
# the second mic and the reference.
#
# The reference is tapped after the DAC and before the amplifier. Volume is
# applied digitally in the ES8311, so the tap tracks it; the fixed-gain NS4150B
# downstream does not change the relationship.
# ---------------------------------------------------------------------------
external_components:
  - source: github://n-IA-hane/esphome-audio-stack@v2026.7.0
    components: [esp_audio_stack, esp_afe]

esp_afe:
  id: afe_processor
  type: sr # wake-word/VA shape rather than the full-duplex fd pipeline
  mode: low_cost
  mic_num: 2
  # SE/BSS is structural for a dual-mic AFE - the component rejects mic_num: 2
  # without it. It also earns MIC2 its keep: spatial separation of the talker
  # from everything else in the room.
  se_enabled: true
  aec_enabled: true
  ns_enabled: true
  # VAD and AGC stay off: micro_wake_word does its own gating, and AGC fights
  # the analog gain staging on the ES7210 below.
  vad_enabled: false
  agc_enabled: false
  # mic, mic, reference - the slot order after extraction.
  input_format: mmr

  # The feed and fetch rings default to internal RAM (~24.6 KB and ~8.2 KB).
  # That is the difference between Bluedroid initialising and not: with them
  # internal, BLE ran out during btc_init_bluetooth, BTU_StartUp bailed to
  # BTU_ShutDown, and the teardown path dereferenced structures it had never
  # allocated - a LoadProhibited panic in l2c_free, on a loop.
  feed_buf_in_psram: true
  feed_ring_in_psram: true
  fetch_ring_in_psram: true

esp_audio_stack:
  id: audio_stack
  processor_id: afe_processor
  # 16k on the wire, which is what this board ran before the migration
  # ($i2s_sample_rate was 16000) - so this is the known-good clocking, not a
  # downgrade. The media pipelines still decode at 48k and the resampler
  # speakers below bring them down, exactly as they always did.
  #
  # Running the bus at 48k instead costs three times the buffer memory on every
  # stage and forces a 3-channel rate converter across the TDM frame, which is
  # what the first two attempts died on. ESP-SR wants 16k regardless, so the
  # upsample bought nothing.
  sample_rate: 16000
  output_sample_rate: 16000
  # 32-bit slots: the ES7210 clocks TDM at 32 bits per slot regardless of how
  # many bits actually carry signal.
  bits_per_sample: 32
  slot_bit_width: 32

  i2s_mclk_pin: $i2s_mclk
  i2s_bclk_pin: $i2s_bclk
  i2s_lrclk_pin: $i2s_lrclk
  i2s_din_pin: GPIO15
  i2s_dout_pin: GPIO16

  # Measured, not read off the schematic. Playing music and watching the slot
  # level sensors: slot 1 sits at -60 dBFS when nothing plays - well below the
  # room noise slot 0 hears - then jumps to -19 dBFS the moment playback starts,
  # a 41 dB swing. That is an electrical tap, not a microphone. Slot 0 moves
  # only 11 dB and hears the room constantly, which is what a mic does.
  #
  # So the ES7210 does not lay its channels across the TDM frame in MIC1..MIC4
  # order. The frame is MIC1, MIC3, MIC2, MIC4 - the reference sits between the
  # two mics. Same layout as the component's own ES7210 example, which is worth
  # believing over the schematic's channel numbering.
  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slots: [0, 2]
  tdm_ref_slot: 1 # the AEC tap
  tdm_tx_slot: 0

  # Not optional on this board. The frame buffers scale with slots x bit depth
  # x resample ratio, and four 32-bit slots at 48k feeding a 16k processor works
  # out to about 219 KB - rx, tdm_tx, tx_clock and tx_32 are ~49 KB each. The
  # default is MALLOC_CAP_INTERNAL, and there is nowhere near that much internal
  # RAM left once ESP-SR, the wifi buffers, BLE and the wake-word model have
  # taken theirs: the first attempt died on "Audio buffer preallocation failed"
  # with 140 KB free and a 131 KB largest block. These are not DMA buffers - the
  # I2S descriptors are allocated separately by the IDF driver - so PSRAM is a
  # correct home for them, and there are 5.3 MB of it going spare.
  buffers_in_psram: true
  audio_task_stack_in_psram: true

  # No master_volume_min_db here, and that is deliberate - it is the wrong knob
  # and it was set to -30 for a while on the theory that it was the right one.
  # It only shapes the *hardware* master curve, i.e. the optional
  # `number: platform: esp_audio_stack, master_volume:` entity, which this
  # package does not create and which therefore sits pinned at 100% = 0 dB.
  #
  # The media player's volume never reaches that path. It runs
  # resampler -> mixer -> this speaker -> ESPAudioStack::set_output_volume(),
  # a software q31 gain whose floor is the component's hardcoded
  # SOFTWARE_VOLUME_MIN_DB of -49 dB, linear in dB from there to 0 dB at 1.0.
  # See the volume_min/volume_max comment on the media player below for what
  # that costs against the old audio_dac path and why the limits changed.

  codec:
    i2c_id: internal_i2c
    input:
      type: es7210
      address: 0x40
      gain_db: 30.0
      # Per-channel override for the reference: the divider already puts the
      # tap at line level, so it must not get the mics' 30 dB of PGA or it
      # clips and AEC has nothing usable to subtract.
      #
      # This is NOT tdm_ref_slot and must not be kept in sync with it. It is a
      # physical ES7210 ADC channel (MIC1=0 .. MIC4=3) passed to
      # esp_codec_dev_set_in_channel_gain, whereas tdm_ref_slot is a position in
      # the TDM frame. On this board the reference is MIC3, i.e. channel 2, but
      # it lands in frame slot 1. Setting this to 1 to "match" hands the 0 dB
      # override to MIC2 instead and leaves the second mic 30 dB down.
      ref_channel: 2
      ref_gain_db: 0.0
    output:
      type: es8311
      address: 0x18
      use_mclk: true

microphone:
  - platform: esp_audio_stack
    id: clean_mic
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: i2s_audio_speaker
    esp_audio_stack_id: audio_stack
    timeout: never
    buffer_duration: 500ms
    # The platform deliberately leaves sample_rate unset - it plays at whatever
    # the bus runs at, resolved in C++ at setup(). The mixer below needs a
    # concrete rate at config time, so state the bus rate explicitly. Keep this
    # equal to esp_audio_stack's sample_rate. Same story for bits_per_sample:
    # the platform clamps to 16-bit either way, but the mixer wants it stated.
    sample_rate: 16000
    bits_per_sample: 16

  # Virtual speakers to combine the announcement and media streams together into one output
  #
  # Mono, not stereo: a TDM bus places playback in tdm_tx_slot, so the stack
  # disables stereo TX and the mixer has to match. No loss on this board - there
  # is one NS4150B driving one speaker off PA_OUTL+/-.
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
      - id: sendspin_mixing_input
        timeout: never

  # Virtual speakers to resample each pipeline's audio, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
  - platform: resampler
    id: sendspin_resampling_speaker
    output_speaker: sendspin_mixing_input

media_player:
  - platform: speaker
    id: external_media_player
    name: None
    internal: False
    volume_increment: 0.01
    # Volume limits, and why they are no longer 0.4/0.8.
    #
    # These are the ends of a remap: HA's 0..100% becomes volume_min..volume_max,
    # which the speaker chain hands to ESPAudioStack::set_output_volume() - a
    # software gain that is linear in dB from -49 dB at 0.0 to 0 dB at 1.0.
    # 0.8 therefore meant -9.8 dB, and full volume was a tenth of the power it
    # could have been.
    #
    # The old i2s_audio speaker had `audio_dac: es8311_dac`, so the same 0.8 went
    # to the ES8311's volume register instead: 0.8 * 255 = 204, and 0xBF is 0 dB
    # at 0.5 dB a step, i.e. *+6.5 dB*. That is the 16 dB that went missing in
    # the migration, and it is why this got quieter than it used to be.
    #
    # 1.0 buys 9.8 dB of it back. The last 6.5 dB is not reachable from YAML:
    # esp_audio_stack clamps both its volume curves at 0 dB, so unity really is
    # the ceiling now. It would need the component to allow a positive
    # master_volume_max_db - the ES8311 register goes to +32 dB and
    # esp_codec_dev_set_vol_curve takes a float - or ESPHome's es8311 audio_dac
    # driving the same chip the stack is already driving, which is worse than
    # being 6.5 dB down.
    #
    # volume_min drops to match: on the old ES8311 curve 0.4 was -44.5 dB, and
    # 0.1 on this one is -44.1 dB, so the bottom of the HA slider is unchanged.
    volume_min: 0.1
    volume_max: 1.0
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC # FLAC is the least processor intensive codec
      num_channels: 1 # Stereo audio is unnecessary for announcements
      sample_rate: 48000 #Supported by Music Assistant
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC # FLAC is the least processor intensive codec
      num_channels: 1 # follows the mono mixer above
      sample_rate: 48000
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - mixer_speaker.apply_ducking:
          id: sendspin_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      - if:
          condition:
            and:
              - switch.is_off: timer_ringing
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing:
                    id: external_media_player
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1.0s
            - mixer_speaker.apply_ducking:
                id: sendspin_mixing_input
                decibel_reduction: 0
                duration: 1.0s
      - script.execute: control_leds
    on_mute:
      - delay: 100ms # Debounce
      - script.execute: control_leds_volume_changed
    on_unmute:
      - delay: 100ms # Debounce
      - script.execute: control_leds_volume_changed
    on_volume:
      if:
        condition:
          - lambda: return !id(init_in_progress);
        then:
          - delay: 100ms # Debounce
          - script.execute: control_leds_volume_changed
    files:
      - id: mute_switch_on_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_on.flac
      - id: mute_switch_off_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_off.flac
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
      - id: wake_word_triggered_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac
      - id: error_cloud_expired
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/error_cloud_expired.mp3

  # Sendspin's own media_player entity, entirely separate from the one above.
  # It feeds sendspin_media_source into its own resampler/mixer input, so it
  # plays alongside announcements/media rather than through them.
  - platform: speaker_source
    id: sendspin_media_player
    name: "Sendspin"
    media_pipeline:
      speaker: sendspin_resampling_speaker
      sources:
        - sendspin_media_source
    on_state:
      - script.execute: control_leds

voice_assistant:
  id: va
  microphone:
    id: va_mic
    microphone: clean_mic
    # The stack publishes a single post-AEC mono stream, so there is no channel
    # to pick any more.
    channels: 0
  media_player: external_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1
  on_client_connected:
    - if:
        condition:
          - lambda: return id(init_in_progress);
          - switch.is_on: mic_mute_switch
        then:
          - switch.turn_off: mic_mute_switch
    - lambda: id(init_in_progress) = false;
    - micro_wake_word.start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_client_disconnected:
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds
  on_error:
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
    - if:
        condition:
          - lambda: return code == "cloud-auth-failed";
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return id(error_cloud_expired);
  on_start:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 30
        duration: 0.0s
    - mixer_speaker.apply_ducking:
        id: sendspin_mixing_input
        decibel_reduction: 30
        duration: 0.0s
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
  # These two fire from Home Assistant, not from this device. End-of-speech is
  # decided by assist_pipeline's VoiceCommandSegmenter, which ends a command
  # after silence_seconds (0.7 by default) of continuous non-speech and
  # otherwise gives up at timeout_seconds (15).
  #
  # That is why a talking TV makes commands hang until they time out: its
  # dialogue rarely leaves a 0.7 s gap. Nothing in this file can fix that, and
  # several plausible-looking fixes have already been ruled out on this
  # hardware - AEC, dual-mic BSS, wake-word channel locking, DoA, null-steering.
  # Before trying any of them again, read "Known limitation: a TV in the room"
  # in the README. The only exposed control is HA's "Finished speaking
  # detection" select on the device entity.
  on_stt_vad_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds
  on_intent_progress:
    - if:
        condition:
          lambda: 'return !x.empty();'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          - script.execute: activate_stop_word_once
  on_tts_start:
    - if:
        condition:
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          - script.execute: activate_stop_word_once
  on_tts_end:
    - script.execute:
        id: send_tts_uri_event
        tts_uri: !lambda 'return x;'
  on_stt_end:
    - script.execute:
        id: send_stt_text_event
        stt_text: !lambda 'return x;'
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    - mixer_speaker.apply_ducking:
        id: sendspin_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_timer_finished:
    - switch.turn_on: timer_ringing
    - lambda: |
        id(next_timer).publish_state(-1);
        id(next_timer_name).publish_state("-");
  on_timer_started:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        }
    - script.execute: control_leds
  on_timer_cancelled:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        } else {
          id(next_timer).publish_state(-1);
          id(next_timer_name).publish_state("-");
        }
    - script.execute: control_leds
  on_timer_updated:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        }
    - script.execute: control_leds
  on_timer_tick:
    - lambda: |
        id(fetch_first_active_timer).execute();
        int seconds_left = id(first_active_timer).seconds_left;
        if (seconds_left % 5 == 0) {
          id(next_timer).publish_state(seconds_left);
        }

micro_wake_word:
  id: mww
  microphone:
    microphone: clean_mic
    channels: 0
  stop_after_detection: false
  # Every loaded model runs inference on every frame, so an unused one is pure
  # CPU cost on the path that is already the tightest. okay_nabu was dropped
  # for that reason; add it back only if you actually say it.
  models:
    - model: hey_jarvis
      id: hey_jarvis
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  vad:
    probability_cutoff: 0.03
  on_wake_word_detected:
    - if:
        condition:
          switch.is_off: mic_mute_switch
        then:
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      voice_assistant.stop:
                    else:
                      - if:
                          condition:
                            media_player.is_announcing:
                              id: external_media_player
                          then:
                            - media_player.stop:
                                id: external_media_player
                                announcement: true
                          else:
                            - if:
                                condition:
                                  switch.is_on: wake_sound
                                then:
                                  - script.execute:
                                      id: play_sound
                                      priority: true
                                      sound_file: !lambda return id(wake_word_triggered_sound);
                                  - delay: 300ms
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;

globals:
  - id: mic_is_muted
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: led_ring_color_r
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: led_ring_color_g
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: led_ring_color_b
    type: float
    restore_value: yes
    initial_value: '1.0'
  # The brightness the ring is currently showing - the user's configured
  # brightness for every state except mute, which sits below that slider's
  # 0.4 minimum. Kept alongside the colour so the led_ring_brightness slider's
  # on_value can re-apply whatever is live without knowing the state.
  - id: led_ring_brightness_active
    type: float
    restore_value: no
    initial_value: '0.8'
  # Per-stage LED effect, editable from HA (select entities below) and
  # persisted like saved_alarm_action is - restore_value on both the select
  # and its backing global. Colour stays hardcoded in control_leds; only the
  # effect (Pulse Fast, Comet, solid, ...) is configurable per stage.
  - id: effect_waiting_for_command
    type: std::string
    restore_value: yes
    initial_value: '"solid"'
  - id: effect_listening_for_command
    type: std::string
    restore_value: yes
    initial_value: '"Pulse Fast"'
  - id: effect_thinking
    type: std::string
    restore_value: yes
    initial_value: '"Comet"'
  - id: effect_replying
    type: std::string
    restore_value: yes
    initial_value: '"Pulse Slow"'
  - id: effect_error
    type: std::string
    restore_value: yes
    initial_value: '"Pulse Fast"'
  - id: effect_not_ready
    type: std::string
    restore_value: yes
    initial_value: '"Pulse Slow"'
  - id: effect_muted
    type: std::string
    restore_value: yes
    initial_value: '"solid"'
  - id: effect_timers_active
    type: std::string
    restore_value: yes
    initial_value: '"Pulse Slow"'
  - id: effect_ringing
    type: std::string
    restore_value: yes
    initial_value: '"Pulse Fast"'
  - id: effect_playing_music
    type: std::string
    restore_value: yes
    initial_value: '"Pulse Slow"'
  # Which TDM slot the audio stack is currently using as the AEC reference, so
  # debug_ref_slot can skip the bus restart when the value has not actually
  # changed. Must match tdm_ref_slot in the esp_audio_stack block.
  - id: active_ref_slot
    type: int
    restore_value: no
    initial_value: '1'
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: improv_ble_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}
  - id: saved_alarm_time
    type: std::string
    restore_value: yes
    initial_value: '"Unknown"'
  - id: saved_time_zone
    type: std::string
    restore_value: yes
    initial_value: '"UTC0"'
  - id: saved_alarm_action
    type: std::string
    restore_value: yes
    initial_value: '"Play sound"'
  - id: first_active_timer
    type: voice_assistant::Timer
    restore_value: no
  - id: is_timer_active
    type: bool
    restore_value: no
  - id: factory_reset_requested
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: stalled_announcement_for_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

script:
  # Mute and unmute both flash this, in the colour of the state being entered:
  # red going quiet, purple coming back. A red unmute flash would have been the
  # wrong signal now that a resting red ring is what muted looks like.
  #
  # It used to end by turning the ring off, which stranded it dark until
  # whatever next called control_leds - now it hands back, so the flash settles
  # onto the mute indicator (or onto a pending timer, which the old turn_off
  # also used to blank).
  - id: flash_ring
    mode: restart
    parameters:
      r: float
      g: float
      b: float
    then:
      - light.turn_on:
          id: status_ring
          brightness: 100%
          red: !lambda 'return r;'
          green: !lambda 'return g;'
          blue: !lambda 'return b;'
          effect: "None"
      - delay: 250ms
      - script.execute: control_leds

  # brightness is passed in rather than read from led_ring_brightness, because
  # the mute indicator sits below that number's 0.4 minimum. Callers that want
  # the user's configured brightness pass it explicitly.
  - id: led_set_effect
    mode: restart
    parameters:
      effect: std::string
      r: float
      g: float
      b: float
      brightness: float
    then:
      - lambda: |-
          id(led_ring_color_r) = r;
          id(led_ring_color_g) = g;
          id(led_ring_color_b) = b;
          id(led_ring_brightness_active) = brightness;
          ESP_LOGI("led", "led_set_effect: effect='%s' rgb(%.2f, %.2f, %.2f) brightness=%.2f",
                   effect.c_str(), r, g, b, brightness);
      - if:
          condition:
            lambda: 'return effect == "off";'
          then:
            - light.turn_off: status_ring
          else:
            - if:
                condition:
                  lambda: 'return effect == "solid";'
                then:
                  # "None" clears whatever effect was running - light.turn_on
                  # without it leaves the old effect animating in a new colour.
                  - light.turn_on:
                      id: status_ring
                      brightness: !lambda 'return id(led_ring_brightness_active);'
                      red: !lambda 'return id(led_ring_color_r);'
                      green: !lambda 'return id(led_ring_color_g);'
                      blue: !lambda 'return id(led_ring_color_b);'
                      effect: "None"
                else:
                  - light.turn_on:
                      id: status_ring
                      brightness: !lambda 'return id(led_ring_brightness_active);'
                      red: !lambda 'return id(led_ring_color_r);'
                      green: !lambda 'return id(led_ring_color_g);'
                      blue: !lambda 'return id(led_ring_color_b);'
                      effect: !lambda 'return effect;'

  - id: control_leds
    mode: single
    then:
      - lambda: |-
          const bool wifi_connected = id(wifi_id).is_connected();
          const bool api_connected  = id(api_id).is_connected();
          const bool ringing        = id(timer_ringing).state;
          const bool improv_ble     = id(improv_ble_in_progress);
          const bool init_progress  = id(init_in_progress);
          const bool muted          = id(mic_is_muted);
          const int  phase          = id(voice_assistant_phase);
          const bool playing_music  = id(external_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                                       id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;

          id(check_if_timers_active).execute();
          const bool timers_active = id(is_timer_active);

          ESP_LOGD("led",
                   "control_leds: wifi=%d api=%d improv=%d init=%d ringing=%d timers_active=%d muted=%d phase=%d playing_music=%d",
                   (int)wifi_connected, (int)api_connected, (int)improv_ble, (int)init_progress,
                   (int)ringing, (int)timers_active, (int)muted, phase, (int)playing_music);

          auto set = [&](const char* effect, float r, float g, float b) {
            id(led_set_effect).execute(effect, r, g, b, id(led_ring_brightness).state);
          };
          auto set_dim = [&](const char* effect, float r, float g, float b, float brightness) {
            id(led_set_effect).execute(effect, r, g, b, brightness);
          };

          if (improv_ble) {
            set("Pulse Medium", 1.0, 0.89, 0.71);
            return;
          }
          if (init_progress) {
            if (wifi_connected) set("Rainbow Slow", 0.9, 0.1, 0.85); else set("Rainbow Slow", 1.0, 0.1, 0.1);
            return;
          }
          if (!wifi_connected || !api_connected) {
            set("Pulse Medium", 1.0, 0.0, 0.0);
            return;
          }
          if (ringing) {
            set(id(effect_ringing).c_str(), 0.0, 1.0, 0.2);
            return;
          }

          // Purple = the turn is yours, blue = the device is talking back.
          // Motion carries the phase within purple, since speed alone is too
          // subtle to read across a room: steady means it is waiting on you,
          // fast pulse means it hears you, rotation means it is working.
          // Timers and alarms own green, on the same steady/fast split.
          // The purple is rgb(255, 28, 241) - measured off the ring, not
          // derived. The previous 0.55/0.0/1.0 read as blue, because a WS2812's
          // blue die is far brighter than its red at equal PWM. All three
          // phases share the one hue; the effect is what tells them apart.
          // Effects are configurable per stage (see the select: entities
          // below) - only the colour stays fixed here.
          switch (phase) {
            case ${voice_assist_waiting_for_command_phase_id}:
              set(id(effect_waiting_for_command).c_str(), 1.0, 0.11, 0.945);    // awake, waiting for you
              return;
            case ${voice_assist_listening_for_command_phase_id}:
              set(id(effect_listening_for_command).c_str(), 1.0, 0.11, 0.945); // hearing you speak
              return;
            case ${voice_assist_thinking_phase_id}:
              set(id(effect_thinking).c_str(), 1.0, 0.11, 0.945);              // spinning = working
              return;
            case ${voice_assist_replying_phase_id}:
              set(id(effect_replying).c_str(), 0.0, 0.35, 1.0);                // its turn to talk
              return;
            case ${voice_assist_error_phase_id}:
              set(id(effect_error).c_str(), 1.0, 0.0, 0.0);
              return;
            case ${voice_assist_not_ready_phase_id}:
              set(id(effect_not_ready).c_str(), 1.0, 0.0, 0.0);
              return;
            default: break;
          }

          // Muted outranks a pending timer. Both are resting states, but this
          // is the one where the device will not answer you at all - a green
          // pulse hiding that leaves you saying the wake word at a dead mic
          // with nothing on the ring to explain it. It stays below ringing and
          // below every voice phase, which are all momentary.
          if (muted) {
            set_dim(id(effect_muted).c_str(), 1.0, 0.0, 0.0, 0.12);
            return;
          }

          if (timers_active) {
            set(id(effect_timers_active).c_str(), 0.0, 1.0, 0.2);
            return;
          }

          // Lowest-priority resting state: teal, so it reads apart from the
          // purple/blue voice phases, the red error/muted states and the
          // green timer states. Anything above still outranks it, same as it
          // outranks plain "off" - a kitchen timer or a mute should still be
          // visible over quiet background music.
          if (playing_music) {
            set(id(effect_playing_music).c_str(), 0.0, 0.8, 0.8);
            return;
          }

          set("off", 0, 0, 0);

  - id: control_leds_volume_changed
    mode: restart
    then:
      # White, not green: green now means timers, and this flash is Pulse Fast
      # like a ringing timer is. Flashing green here would have been invisible
      # feedback in exactly the case you most want it - hitting volume while an
      # alarm is going off. White belongs to no phase, so it always reads.
      - light.turn_on:
          id: status_ring
          brightness: !lambda 'return id(led_ring_brightness).state;'
          red: 1.0
          green: 1.0
          blue: 1.0
          effect: "Pulse Fast"
      - lambda: |-
          ESP_LOGD("led", "volume_changed: flash white");
      - delay: 1.2s
      - script.execute: control_leds

  - id: ring_timer
    then:
      - script.execute: enable_repeat_one
      - script.execute:
          id: play_sound
          priority: true
          sound_file: !lambda return id(timer_finished_sound);

  - id: enable_repeat_one
    then:
      - lambda: |-
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
              .set_announcement(true)
              .perform();
            id(external_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 500);

  - id: disable_repeat
    then:
      - lambda: |-
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
              .set_announcement(true)
              .perform();
            id(external_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);

  - id: play_sound
    parameters:
      priority: bool
      sound_file: "audio::AudioFile*"
    then:
      - lambda: |-
          if (priority) {
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ((id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING) || priority) {
            id(external_media_player)->play_file(sound_file, true, false);
          }

  - id: fetch_first_active_timer
    mode: single
    then:
      - lambda: |
          static uint32_t last_fetch_time = 0;
          uint32_t now = millis();
          if (now - last_fetch_time < 500) return;
          last_fetch_time = now;

          const auto &timers = id(va).get_timers();
          if (timers.empty()) return;

          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.is_active && timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(first_active_timer) = output_timer;

  - id: check_if_timers_active
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          bool output = false;
          if (!timers.empty()) {
            for (const auto &timer : timers) {
              if (timer.is_active) {
                output = true;
                break;
              }
            }
          }
          id(is_timer_active) = output;

  - id: activate_stop_word_once
    then:
      - delay: 1s
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing:
                    id: external_media_player
            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - micro_wake_word.disable_model: stop

  - id: check_alarm
    then:
      - lambda: |-
          id(publish_current_time).execute();
          if (id(alarm_on).state && id(alarm_time).has_state()) {
            auto set_alarm_time = id(alarm_time).state;
            if (set_alarm_time.length() == 5 &&
                isdigit(set_alarm_time[0]) && isdigit(set_alarm_time[1]) &&
                isdigit(set_alarm_time[3]) && isdigit(set_alarm_time[4])) {
              auto alarm_hour = std::stoi(set_alarm_time.substr(0, 2));
              auto alarm_minute = std::stoi(set_alarm_time.substr(3, 2));

              auto time_now = id(rtc).now();
              if (time_now.hour == alarm_hour && time_now.minute == alarm_minute) {
                auto action = id(alarm_action).current_option();
                if (action == "Play sound") {
                  id(timer_ringing).turn_on();
                } else if (action == "Send event") {
                  id(send_alarm_event).execute();
                } else if (action == "Sound and event") {
                  id(timer_ringing).turn_on();
                  id(send_alarm_event).execute();
                }
              }
            } else {
              ESP_LOGW("alarm", "Incorrect alarm time setting");
            }
          }

  - id: send_alarm_event
    then:
      - homeassistant.event:
          event: esphome.alarm_ringing

  - id: send_tts_uri_event
    parameters:
      tts_uri: string
    then:
      - homeassistant.event:
          event: esphome.tts_uri
          data:
            uri: !lambda return tts_uri;

  - id: send_stt_text_event
    parameters:
      stt_text: string
    then:
      - homeassistant.event:
          event: esphome.stt_text
          data:
            text: !lambda return stt_text;

  # A failed announcement URL is retried forever by the speaker media player:
  # the playlist item is only popped once a file has played, so a read error
  # restarts the same dead URL ~20x/second until something stops it. Drop the
  # announcement ourselves so the ring, the log and HA all recover.
  - id: abort_stalled_announcement
    mode: single
    then:
      - logger.log:
          level: ERROR
          format: "Announcement produced no audio for %dms, dropping it"
          args: ['${stalled_announcement_ms}']
      - lambda: |-
          id(external_media_player)
            ->make_call()
            .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
            .set_announcement(true)
            .perform();
      - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
      - script.execute: control_leds
      - delay: 2s
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
          timeout: 10s
      - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
      - script.execute: control_leds

  - id: publish_current_time
    mode: single
    then:
      - lambda: |-
          static std::string last_time_string = "";
          auto time_now = id(rtc).now();
          std::string current_time_string = time_now.strftime("%H:%M");
          if (current_time_string != last_time_string) {
            id(current_time).publish_state(current_time_string);
            last_time_string = current_time_string;
          }

interval:
  # Nothing is decoded while the reader is failing, so the announcement speaker
  # never starts - that, and not the media player state, is what tells a stuck
  # announcement apart from one that is simply still playing.
  - interval: 1s
    then:
      - lambda: |-
          const bool announcing =
              id(external_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
          if (!announcing || id(announcement_resampling_speaker)->is_running() ||
              id(timer_ringing).state) {
            id(stalled_announcement_for_ms) = 0;
            return;
          }
          id(stalled_announcement_for_ms) += 1000;
          if (id(stalled_announcement_for_ms) >= ${stalled_announcement_ms}) {
            id(stalled_announcement_for_ms) = 0;
            id(abort_stalled_announcement).execute();
          }

select:
  - platform: template
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    # Cutoffs are uint8, quantising probability 0.0-1.0 onto 0-255, so these are
    # roughly 0.85 / 0.69 / 0.20. This used to set them on okay_nabu, which is
    # no longer loaded - the entity moved but never followed the model, so it
    # had been adjusting nothing for a while.
    #
    # The internal "stop" model is deliberately left at its own default: it is
    # only enabled while the device is talking, and making it more sensitive
    # here would cut off replies, which is a different tradeoff from how eagerly
    # the device should wake up.
    on_value:
      lambda: |-
        if (x == "Slightly sensitive") {
          id(hey_jarvis).set_probability_cutoff(217);
        } else if (x == "Moderately sensitive") {
          id(hey_jarvis).set_probability_cutoff(176);
        } else if (x == "Very sensitive") {
          id(hey_jarvis).set_probability_cutoff(50);
        }
  - platform: logger
    id: logger_select
    name: Logger Level
    disabled_by_default: true
  - platform: template
    optimistic: true
    name: "Alarm action"
