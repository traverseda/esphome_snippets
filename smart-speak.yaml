# ---------------------------------------------------------------------------
# Audio path: ESP-SR front end over a 4-slot TDM capture.
#
# The board's ES7210 is a four-channel ADC, and the schematic wires it as:
#   ch1 (slot 0) MIC1_P/N      - left array mic
#   ch2 (slot 1) MIC2_P/N      - right array mic
#   ch3 (slot 2) ADC_MIC3_P/N  - the block marked AEC: the ES8311's OUTP/OUTN
#                                fed back through a divider, i.e. an electrical
#                                copy of what the speaker is playing
#   ch4 (slot 3) ADC_MIC4_P/N  - coupling caps only, nothing drives it
#
# Reading slot 2 alongside the mics is what lets ESP-SR subtract the playback
# from the capture, so the wake word survives music and TTS. The old config read
# a plain stereo I2S frame and took the left channel only, which threw away both
# the second mic and the reference.
#
# The reference is tapped after the DAC and before the amplifier. Volume is
# applied digitally in the ES8311, so the tap tracks it; the fixed-gain NS4150B
# downstream does not change the relationship.
# ---------------------------------------------------------------------------
external_components:
  - source: github://n-IA-hane/esphome-audio-stack@v2026.7.0
    components: [esp_audio_stack, esp_afe]

esp_afe:
  id: afe_processor
  type: sr # wake-word/VA shape rather than the full-duplex fd pipeline
  mode: low_cost
  mic_num: 2
  # SE/BSS is structural for a dual-mic AFE - the component rejects mic_num: 2
  # without it. It also earns MIC2 its keep: spatial separation of the talker
  # from everything else in the room.
  se_enabled: true
  aec_enabled: true
  ns_enabled: true
  # VAD and AGC stay off: micro_wake_word does its own gating, and AGC fights
  # the analog gain staging on the ES7210 below.
  vad_enabled: false
  agc_enabled: false
  # mic, mic, reference - the slot order after extraction.
  input_format: mmr

  # The feed and fetch rings default to internal RAM (~24.6 KB and ~8.2 KB).
  # That is the difference between Bluedroid initialising and not: with them
  # internal, BLE ran out during btc_init_bluetooth, BTU_StartUp bailed to
  # BTU_ShutDown, and the teardown path dereferenced structures it had never
  # allocated - a LoadProhibited panic in l2c_free, on a loop.
  feed_buf_in_psram: true
  feed_ring_in_psram: true
  fetch_ring_in_psram: true

esp_audio_stack:
  id: audio_stack
  processor_id: afe_processor
  # 16k on the wire, which is what this board ran before the migration
  # ($i2s_sample_rate was 16000) - so this is the known-good clocking, not a
  # downgrade. The media pipelines still decode at 48k and the resampler
  # speakers below bring them down, exactly as they always did.
  #
  # Running the bus at 48k instead costs three times the buffer memory on every
  # stage and forces a 3-channel rate converter across the TDM frame, which is
  # what the first two attempts died on. ESP-SR wants 16k regardless, so the
  # upsample bought nothing.
  sample_rate: 16000
  output_sample_rate: 16000
  # 32-bit slots: the ES7210 clocks TDM at 32 bits per slot regardless of how
  # many bits actually carry signal.
  bits_per_sample: 32
  slot_bit_width: 32

  i2s_mclk_pin: $i2s_mclk
  i2s_bclk_pin: $i2s_bclk
  i2s_lrclk_pin: $i2s_lrclk
  i2s_din_pin: GPIO15
  i2s_dout_pin: GPIO16

  # Measured, not read off the schematic. Playing music and watching the slot
  # level sensors: slot 1 sits at -60 dBFS when nothing plays - well below the
  # room noise slot 0 hears - then jumps to -19 dBFS the moment playback starts,
  # a 41 dB swing. That is an electrical tap, not a microphone. Slot 0 moves
  # only 11 dB and hears the room constantly, which is what a mic does.
  #
  # So the ES7210 does not lay its channels across the TDM frame in MIC1..MIC4
  # order. The frame is MIC1, MIC3, MIC2, MIC4 - the reference sits between the
  # two mics. Same layout as the component's own ES7210 example, which is worth
  # believing over the schematic's channel numbering.
  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slots: [0, 2]
  tdm_ref_slot: 1 # the AEC tap
  tdm_tx_slot: 0

  # Not optional on this board. The frame buffers scale with slots x bit depth
  # x resample ratio, and four 32-bit slots at 48k feeding a 16k processor works
  # out to about 219 KB - rx, tdm_tx, tx_clock and tx_32 are ~49 KB each. The
  # default is MALLOC_CAP_INTERNAL, and there is nowhere near that much internal
  # RAM left once ESP-SR, the wifi buffers, BLE and the wake-word model have
  # taken theirs: the first attempt died on "Audio buffer preallocation failed"
  # with 140 KB free and a 131 KB largest block. These are not DMA buffers - the
  # I2S descriptors are allocated separately by the IDF driver - so PSRAM is a
  # correct home for them, and there are 5.3 MB of it going spare.
  buffers_in_psram: true
  audio_task_stack_in_psram: true

  # No master_volume_min_db here, and that is deliberate - it is the wrong knob
  # and it was set to -30 for a while on the theory that it was the right one.
  # It only shapes the *hardware* master curve, i.e. the optional
  # `number: platform: esp_audio_stack, master_volume:` entity, which this
  # package does not create and which therefore sits pinned at 100% = 0 dB.
  #
  # The media player's volume never reaches that path. It runs
  # resampler -> mixer -> this speaker -> ESPAudioStack::set_output_volume(),
  # a software q31 gain whose floor is the component's hardcoded
  # SOFTWARE_VOLUME_MIN_DB of -49 dB, linear in dB from there to 0 dB at 1.0.
  # See the volume_min/volume_max comment on the media player below for what
  # that costs against the old audio_dac path and why the limits changed.

  codec:
    i2c_id: internal_i2c
    input:
      type: es7210
      address: 0x40
      gain_db: 30.0
      # Per-channel override for the reference: the divider already puts the
      # tap at line level, so it must not get the mics' 30 dB of PGA or it
      # clips and AEC has nothing usable to subtract.
      #
      # This is NOT tdm_ref_slot and must not be kept in sync with it. It is a
      # physical ES7210 ADC channel (MIC1=0 .. MIC4=3) passed to
      # esp_codec_dev_set_in_channel_gain, whereas tdm_ref_slot is a position in
      # the TDM frame. On this board the reference is MIC3, i.e. channel 2, but
      # it lands in frame slot 1. Setting this to 1 to "match" hands the 0 dB
      # override to MIC2 instead and leaves the second mic 30 dB down.
      ref_channel: 2
      ref_gain_db: 0.0
    output:
      type: es8311
      address: 0x18
      use_mclk: true

microphone:
  - platform: esp_audio_stack
    id: clean_mic
    esp_audio_stack_id: audio_stack

speaker:
  - platform: esp_audio_stack
    id: i2s_audio_speaker
    esp_audio_stack_id: audio_stack
    timeout: never
    buffer_duration: 500ms
    # The platform deliberately leaves sample_rate unset - it plays at whatever
    # the bus runs at, resolved in C++ at setup(). The mixer below needs a
    # concrete rate at config time, so state the bus rate explicitly. Keep this
    # equal to esp_audio_stack's sample_rate. Same story for bits_per_sample:
    # the platform clamps to 16-bit either way, but the mixer wants it stated.
    sample_rate: 16000
    bits_per_sample: 16

  # Virtual speakers to combine the announcement and media streams together into one output
  #
  # Mono, not stereo: a TDM bus places playback in tdm_tx_slot, so the stack
  # disables stereo TX and the mixer has to match. No loss on this board - there
  # is one NS4150B driving one speaker off PA_OUTL+/-.
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
      - id: sendspin_mixing_input
        timeout: never

  # Virtual speakers to resample each pipeline's audio, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
  - platform: resampler
    id: sendspin_resampling_speaker
    output_speaker: sendspin_mixing_input

media_player:
  - platform: speaker
    id: external_media_player
    name: None
    internal: False
    volume_increment: 0.01
    # Volume limits, and why they are no longer 0.4/0.8.
    #
    # These are the ends of a remap: HA's 0..100% becomes volume_min..volume_max,
    # which the speaker chain hands to ESPAudioStack::set_output_volume() - a
    # software gain that is linear in dB from -49 dB at 0.0 to 0 dB at 1.0.
    # 0.8 therefore meant -9.8 dB, and full volume was a tenth of the power it
    # could have been.
    #
    # The old i2s_audio speaker had `audio_dac: es8311_dac`, so the same 0.8 went
    # to the ES8311's volume register instead: 0.8 * 255 = 204, and 0xBF is 0 dB
    # at 0.5 dB a step, i.e. *+6.5 dB*. That is the 16 dB that went missing in
    # the migration, and it is why this got quieter than it used to be.
    #
    # 1.0 buys 9.8 dB of it back. The last 6.5 dB is not reachable from YAML:
    # esp_audio_stack clamps both its volume curves at 0 dB, so unity really is
    # the ceiling now. It would need the component to allow a positive
    # master_volume_max_db - the ES8311 register goes to +32 dB and
    # esp_codec_dev_set_vol_curve takes a float - or ESPHome's es8311 audio_dac
    # driving the same chip the stack is already driving, which is worse than
    # being 6.5 dB down.
    #
    # volume_min drops to match: on the old ES8311 curve 0.4 was -44.5 dB, and
    # 0.1 on this one is -44.1 dB, so the bottom of the HA slider is unchanged.
    volume_min: 0.1
    volume_max: 1.0
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC # FLAC is the least processor intensive codec
      num_channels: 1 # Stereo audio is unnecessary for announcements
      sample_rate: 48000 #Supported by Music Assistant
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC # FLAC is the least processor intensive codec
      num_channels: 1 # follows the mono mixer above
      sample_rate: 48000
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - mixer_speaker.apply_ducking:
          id: sendspin_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      - if:
          condition:
            and:
              - switch.is_off: timer_ringing
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing:
                    id: external_media_player
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1.0s
            - mixer_speaker.apply_ducking:
                id: sendspin_mixing_input
                decibel_reduction: 0
                duration: 1.0s
      - script.execute: control_leds
    on_mute:
      - delay: 100ms # Debounce
      - script.execute: control_leds_volume_changed
    on_unmute:
      - delay: 100ms # Debounce
      - script.execute: control_leds_volume_changed
    on_volume:
      if:
        condition:
          - lambda: return !id(init_in_progress);
        then:
          - delay: 100ms # Debounce
          - script.execute: control_leds_volume_changed
    files:
      - id: mute_switch_on_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_on.flac
      - id: mute_switch_off_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/mute_switch_off.flac
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
      - id: wake_word_triggered_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac
      - id: error_cloud_expired
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/error_cloud_expired.mp3

  # Sendspin's own media_player entity, entirely separate from the one above.
  # It feeds sendspin_media_source into its own resampler/mixer input, so it
  # plays alongside announcements/media rather than through them.
  - platform: speaker_source
    id: sendspin_media_player
    name: "Sendspin"
    media_pipeline:
      speaker: sendspin_resampling_speaker
      sources:
        - sendspin_media_source
    on_state:
      - script.execute: control_leds

voice_assistant:
  id: va
  microphone:
    id: va_mic
    microphone: clean_mic
    # The stack publishes a single post-AEC mono stream, so there is no channel
    # to pick any more.
    channels: 0
  media_player: external_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1
  on_client_connected:
    - if:
        condition:
          - lambda: return id(init_in_progress);
          - switch.is_on: mic_mute_switch
        then:
          - switch.turn_off: mic_mute_switch
    - lambda: id(init_in_progress) = false;
    - micro_wake_word.start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_client_disconnected:
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds
  on_error:
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
    - if:
        condition:
          - lambda: return code == "cloud-auth-failed";
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return id(error_cloud_expired);
  on_start:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 30
        duration: 0.0s
    - mixer_speaker.apply_ducking:
        id: sendspin_mixing_input
        decibel_reduction: 30
        duration: 0.0s
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
  # These two fire from Home Assistant, not from this device. End-of-speech is
  # decided by assist_pipeline's VoiceCommandSegmenter, which ends a command
  # after silence_seconds (0.7 by default) of continuous non-speech and
  # otherwise gives up at timeout_seconds (15).
  #
  # That is why a talking TV makes commands hang until they time out: its
  # dialogue rarely leaves a 0.7 s gap. Nothing in this file can fix that, and
  # several plausible-looking fixes have already been ruled out on this
  # hardware - AEC, dual-mic BSS, wake-word channel locking, DoA, null-steering.
  # Before trying any of them again, read "Known limitation: a TV in the room"
  # in the README. The only exposed control is HA's "Finished speaking
  # detection" select on the device entity.
  on_stt_vad_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds
  on_intent_progress:
    - if:
        condition:
          lambda: 'return !x.empty();'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          - script.execute: activate_stop_word_once
  on_tts_start:
    - if:
        condition:
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          - script.execute: activate_stop_word_once
  on_tts_end:
    - script.execute:
        id: send_tts_uri_event
        tts_uri: !lambda 'return x;'
  on_stt_end:
    - script.execute:
        id: send_stt_text_event
        stt_text: !lambda 'return x;'
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    - mixer_speaker.apply_ducking:
        id: sendspin_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_timer_finished:
    - switch.turn_on: timer_ringing
    - lambda: |
        id(next_timer).publish_state(-1);
        id(next_timer_name).publish_state("-");
  on_timer_started:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        }
    - script.execute: control_leds
  on_timer_cancelled:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        } else {
          id(next_timer).publish_state(-1);
          id(next_timer_name).publish_state("-");
        }
    - script.execute: control_leds
  on_timer_updated:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        }
    - script.execute: control_leds
  on_timer_tick:
    - lambda: |
        id(fetch_first_active_timer).execute();
        int seconds_left = id(first_active_timer).seconds_left;
        if (seconds_left % 5 == 0) {
          id(next_timer).publish_state(seconds_left);
        }

micro_wake_word:
  id: mww
  microphone:
    microphone: clean_mic
    channels: 0
  stop_after_detection: false
  # Every loaded model runs inference on every frame, so an unused one is pure
  # CPU cost on the path that is already the tightest. okay_nabu was dropped
  # for that reason; add it back only if you actually say it.
  models:
    - model: hey_jarvis
      id: hey_jarvis
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  vad:
    probability_cutoff: 0.03
  on_wake_word_detected:
    - if:
        condition:
          switch.is_off: mic_mute_switch
        then:
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      voice_assistant.stop:
                    else:
                      - if:
                          condition:
                            media_player.is_announcing:
                              id: external_media_player
                          then:
                            - media_player.stop:
                                id: external_media_player
                                announcement: true
                          else:
                            - if:
                                condition:
                                  switch.is_on: wake_sound
                                then:
                                  - script.execute:
                                      id: play_sound
                                      priority: true
                                      sound_file: !lambda return id(wake_word_triggered_sound);
                                  - delay: 300ms
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;

globals:
  - id: mic_is_muted
    type: bool
    restore_value: yes
    initial_value: 'false'
  # Mic level (dBFS) computed from the live mic data stream by the data
  # callback registered in on_boot, so Mic Reactive can react to the actual
  # audio rather than the divider-throttled TDM probe (~4 Hz). Updated on
  # every delivered mic frame (~30 Hz, post-AEC/NS) whenever the mic is
  # capturing. Plain float is fine: a 4-byte aligned load/store is atomic on
  # this core, and a stale intermediate value just makes one frame slightly
  # off.
  - id: mic_audio_level
    type: float
    restore_value: no
    initial_value: '-120.0'
  # One-time migration flag: seeds each per-stage light widget's default
  # color/brightness (see the on_boot step below) exactly once, the first
  # boot after this feature was added. After that, each light's own
  # restore_value (restore_mode: RESTORE_AND_OFF) carries whatever color/
  # brightness the widget was last set to - by the seed step or by the user -
  # so this never runs again and never stomps a real customization.
  - id: stage_lights_seeded
    type: bool
    restore_value: yes
    initial_value: 'false'
  # Persisted per-stage effect, one int per widget, as an index into the
  # shared effects list (None=0, Pulse Slow=1, Pulse Medium=2, Pulse Fast=3,
  # Rainbow Slow=4, Wipe=5, Comet=6, Sound Reactive=7, Mic Reactive=8 - the
  # same order Status Ring declares them, so the index maps straight across).
  # A light's own effect can't be the source of truth: ESPHome clears any
  # effect the moment the light turns off, so the widget never keeps one.
  # These globals are what actually remember the choice - seeded with the
  # defaults below, updated from each widget's on_state whenever it is on
  # with an effect selected (None included), and re-applied by control_leds
  # when the stage activates. int (unlike std::string) is POD-safe to
  # restore, see the saved_alarm_time comment above.
  - id: effect_starting_up
    type: int
    restore_value: yes
    initial_value: '4'
  - id: effect_idle
    type: int
    restore_value: yes
    initial_value: '0'
  - id: effect_waiting_for_command
    type: int
    restore_value: yes
    initial_value: '0'
  - id: effect_listening_for_command
    type: int
    restore_value: yes
    initial_value: '8'
  - id: effect_thinking
    type: int
    restore_value: yes
    initial_value: '6'
  - id: effect_replying
    type: int
    restore_value: yes
    initial_value: '1'
  - id: effect_error
    type: int
    restore_value: yes
    initial_value: '3'
  - id: effect_not_ready
    type: int
    restore_value: yes
    initial_value: '1'
  - id: effect_muted
    type: int
    restore_value: yes
    initial_value: '0'
  - id: effect_timers_active
    type: int
    restore_value: yes
    initial_value: '1'
  - id: effect_ringing
    type: int
    restore_value: yes
    initial_value: '3'
  - id: effect_playing_music
    type: int
    restore_value: yes
    initial_value: '1'
  # Transient per-widget fresh-turn-on tracker: the effect this widget was
  # running at its most recent on_state while on, cleared to 0 whenever the
  # widget turns off. Lets on_state tell a deliberate "None" selection (the
  # widget was already on with an effect, which just got cleared to 0) apart
  # from a plain turn-on (the widget was off, so its effect is 0 for free -
  # ESPHome always clears a light's effect on turn-off). Deliberate is
  # persisted into effect_*; a plain turn-on keeps the persisted choice.
  # restore_value stays off: this is pure runtime state, not a setting.
  - id: last_on_effect_starting_up
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_on_effect_idle
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_on_effect_waiting_for_command
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_on_effect_listening_for_command
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_on_effect_thinking
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_on_effect_replying
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_on_effect_error
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_on_effect_not_ready
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_on_effect_muted
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_on_effect_timers_active
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_on_effect_ringing
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_on_effect_playing_music
    type: int
    restore_value: no
    initial_value: '0'
  # Which TDM slot the audio stack is currently using as the AEC reference, so
  # debug_ref_slot can skip the bus restart when the value has not actually
  # changed. Must match tdm_ref_slot in the esp_audio_stack block.
  - id: active_ref_slot
    type: int
    restore_value: no
    initial_value: '1'
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: improv_ble_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}
  # restore_value stays off: ESPHome's globals restore does a raw sizeof(T)
  # byte copy out of flash, which is only safe for POD types. A std::string's
  # short-string-optimization buffer holds a pointer into the object's own
  # memory even for a 5-character "HH:MM", so restoring it by byte copy aims
  # that pointer at wherever the object used to live, not wherever it lives
  # now - heap corruption (crashed with LoadProhibited inside an unrelated
  # LightState/AddressableLightEffect the first time this was tried). A
  # char[N] array would be the POD-safe fix, but ESPHome's
  # RestoringGlobalsComponent takes its initial value by-value and a C array
  # parameter decays to a pointer, so `type: char[N]` does not compile
  # ("invalid conversion from char* to char"). Not worth chasing a
  # std::array<char, N> workaround for two rarely-changed settings - dropping
  # restore_value means alarm time and time zone reset to these defaults on
  # every reboot instead of persisting, which is the accepted trade here.
  - id: saved_alarm_time
    type: std::string
    initial_value: '"Unknown"'
  - id: saved_time_zone
    type: std::string
    initial_value: '"UTC0"'
  - id: first_active_timer
    type: voice_assistant::Timer
    restore_value: no
  - id: is_timer_active
    type: bool
    restore_value: no
  - id: factory_reset_requested
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: stalled_announcement_for_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

script:
  # Mute and unmute both flash this, in the colour of the state being entered:
  # red going quiet, purple coming back. A red unmute flash would have been the
  # wrong signal now that a resting red ring is what muted looks like.
  #
  # It used to end by turning the ring off, which stranded it dark until
  # whatever next called control_leds - now it hands back, so the flash settles
  # onto the mute indicator (or onto a pending timer, which the old turn_off
  # also used to blank).
  - id: flash_ring
    mode: restart
    parameters:
      r: float
      g: float
      b: float
    then:
      - light.turn_on:
          id: status_ring
          brightness: 100%
          red: !lambda 'return r;'
          green: !lambda 'return g;'
          blue: !lambda 'return b;'
          effect: "None"
      - delay: 250ms
      - script.execute: control_leds

  # Turns off every stage widget, with no shared script or queue involved -
  # each widget's own on_state (see light: above) handles "only one at a
  # time" and pushing to Status Ring entirely on its own now, inline,
  # synchronously, the moment its own state changes. That's deliberate:
  # mode: queued looked like it should guarantee every call eventually
  # runs, but its queue has a small fixed depth and silently drops calls
  # once it's full - which is exactly what caused two widgets to end up on
  # at once under rapid state changes. Routing "turn the others off"
  # through a single shared script, however it's called, reintroduces that
  # same risk. Each widget handling its own exclusion inline has no shared
  # resource to contend over, so there's nothing to drop.
  #
  # This script still exists for clear_stage_lights below: the
  # improv/disconnected cases in control_leds aren't stage widgets, so
  # nothing turns them off automatically - this does it before those cases
  # set Status Ring to their own hardcoded color directly.
  - id: clear_stage_lights
    mode: single
    then:
      - lambda: |-
          light::LightState *lights[] = {
            id(light_starting_up), id(light_idle), id(light_waiting_for_command),
            id(light_listening_for_command), id(light_thinking), id(light_replying),
            id(light_error), id(light_not_ready), id(light_muted),
            id(light_timers_active), id(light_ringing), id(light_playing_music),
          };
          for (auto *l : lights) {
            if (l->remote_values.is_on()) l->turn_off().perform();
          }

  - id: control_leds
    mode: queued
    then:
      - lambda: |-
          const bool wifi_connected = id(wifi_id).is_connected();
          const bool api_connected  = id(api_id).is_connected();
          const bool ringing        = id(timer_ringing).state;
          const bool improv_ble     = id(improv_ble_in_progress);
          const bool init_progress  = id(init_in_progress);
          const bool muted          = id(mic_is_muted);
          const int  phase          = id(voice_assistant_phase);
          const bool playing_music  = id(external_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                                       id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;

          id(check_if_timers_active).execute();
          const bool timers_active = id(is_timer_active);

          ESP_LOGD("led",
                   "control_leds: wifi=%d api=%d improv=%d init=%d ringing=%d timers_active=%d muted=%d phase=%d playing_music=%d",
                   (int)wifi_connected, (int)api_connected, (int)improv_ble, (int)init_progress,
                   (int)ringing, (int)timers_active, (int)muted, phase, (int)playing_music);

          // improv_ble and the disconnected case aren't configurable stages -
          // they're not reachable states to sit tuning colors for, unlike
          // everything below. clear_stage_lights turns off whichever widget
          // was previously active, then these set Status Ring directly,
          // same as before any of the widgets existed.
          if (improv_ble) {
            id(clear_stage_lights).execute();
            auto call = id(status_ring).turn_on();
            call.set_rgb(1.0, 0.89, 0.71);
            call.set_effect("Pulse Medium");
            call.perform();
            return;
          }
          if (!wifi_connected || !api_connected) {
            id(clear_stage_lights).execute();
            auto call = id(status_ring).turn_on();
            call.set_rgb(1.0, 0.0, 0.0);
            call.set_effect("Pulse Medium");
            call.perform();
            return;
          }

          // Every case below just turns its widget on - that widget's own
          // on_state (see light: above) turns the other 11 off and copies
          // its color/effect/brightness onto Status Ring. Same path
          // whether it's this code or you clicking the widget in HA.
          if (init_progress) {
            auto call = id(light_starting_up).turn_on();
            call.set_effect((uint32_t) id(effect_starting_up));
            call.perform();
            return;
          }
          if (ringing) {
            auto call = id(light_ringing).turn_on();
            call.set_effect((uint32_t) id(effect_ringing));
            call.perform();
            return;
          }

          // Purple = the turn is yours, blue = the device is talking back.
          // Timers and alarms own green. Colour, effect and brightness for
          // each of these now come entirely from that stage's "LED: ..."
          // light widget.
          switch (phase) {
            case ${voice_assist_waiting_for_command_phase_id}: {
              auto call = id(light_waiting_for_command).turn_on();
              call.set_effect((uint32_t) id(effect_waiting_for_command));
              call.perform();
              return;
            }
            case ${voice_assist_listening_for_command_phase_id}: {
              auto call = id(light_listening_for_command).turn_on();
              call.set_effect((uint32_t) id(effect_listening_for_command));
              call.perform();
              return;
            }
            case ${voice_assist_thinking_phase_id}: {
              auto call = id(light_thinking).turn_on();
              call.set_effect((uint32_t) id(effect_thinking));
              call.perform();
              return;
            }
            case ${voice_assist_replying_phase_id}: {
              auto call = id(light_replying).turn_on();
              call.set_effect((uint32_t) id(effect_replying));
              call.perform();
              return;
            }
            case ${voice_assist_error_phase_id}: {
              auto call = id(light_error).turn_on();
              call.set_effect((uint32_t) id(effect_error));
              call.perform();
              return;
            }
            case ${voice_assist_not_ready_phase_id}: {
              auto call = id(light_not_ready).turn_on();
              call.set_effect((uint32_t) id(effect_not_ready));
              call.perform();
              return;
            }
            default: break;
          }

          // Muted outranks a pending timer. Both are resting states, but this
          // is the one where the device will not answer you at all - a green
          // pulse hiding that leaves you saying the wake word at a dead mic
          // with nothing on the ring to explain it. It stays below ringing and
          // below every voice phase, which are all momentary.
          if (muted) {
            auto call = id(light_muted).turn_on();
            call.set_effect((uint32_t) id(effect_muted));
            call.perform();
            return;
          }

          if (timers_active) {
            auto call = id(light_timers_active).turn_on();
            call.set_effect((uint32_t) id(effect_timers_active));
            call.perform();
            return;
          }

          // Lowest-priority resting state. Anything above still outranks it,
          // same as it outranks the Idle preset below - a kitchen timer or a
          // mute should still be visible over quiet background music.
          if (playing_music) {
            auto call = id(light_playing_music).turn_on();
            call.set_effect((uint32_t) id(effect_playing_music));
            call.perform();
            return;
          }

          // Idle is the "off" look (defaults to 1% brightness - effectively
          // dark, but not 0, so a bare turn_on can't be auto-brightened back
          // to full). Pass the widget's current brightness explicitly anyway,
          // so whatever the user brightened it to when customizing Idle wins.
          auto call = id(light_idle).turn_on();
          call.set_brightness(id(light_idle).remote_values.get_brightness());
          call.set_effect((uint32_t) id(effect_idle));
          call.perform();

  - id: control_leds_volume_changed
    mode: restart
    then:
      # White, not green: green now means timers, and this flash is Pulse Fast
      # like a ringing timer is. Flashing green here would have been invisible
      # feedback in exactly the case you most want it - hitting volume while an
      # alarm is going off. White belongs to no phase, so it always reads.
      - light.turn_on:
          id: status_ring
          brightness: !lambda 'return id(led_ring_brightness).state;'
          red: 1.0
          green: 1.0
          blue: 1.0
          effect: "Pulse Fast"
      - lambda: |-
          ESP_LOGD("led", "volume_changed: flash white");
      - delay: 1.2s
      - script.execute: control_leds

  - id: ring_timer
    then:
      - script.execute: enable_repeat_one
      - script.execute:
          id: play_sound
          priority: true
          sound_file: !lambda return id(timer_finished_sound);

  - id: enable_repeat_one
    then:
      - lambda: |-
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_ONE)
              .set_announcement(true)
              .perform();
            id(external_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 500);

  - id: disable_repeat
    then:
      - lambda: |-
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_REPEAT_OFF)
              .set_announcement(true)
              .perform();
            id(external_media_player)->set_playlist_delay_ms(speaker::AudioPipelineType::ANNOUNCEMENT, 0);

  - id: play_sound
    parameters:
      priority: bool
      sound_file: "audio::AudioFile*"
    then:
      - lambda: |-
          if (priority) {
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ((id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING) || priority) {
            id(external_media_player)->play_file(sound_file, true, false);
          }

  - id: fetch_first_active_timer
    mode: single
    then:
      - lambda: |
          static uint32_t last_fetch_time = 0;
          uint32_t now = millis();
          if (now - last_fetch_time < 500) return;
          last_fetch_time = now;

          const auto &timers = id(va).get_timers();
          if (timers.empty()) return;

          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.is_active && timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(first_active_timer) = output_timer;

  - id: check_if_timers_active
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          bool output = false;
          if (!timers.empty()) {
            for (const auto &timer : timers) {
              if (timer.is_active) {
                output = true;
                break;
              }
            }
          }
          id(is_timer_active) = output;

  - id: activate_stop_word_once
    then:
      - delay: 1s
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing:
                    id: external_media_player
            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - micro_wake_word.disable_model: stop

  - id: check_alarm
    then:
      - lambda: |-
          id(publish_current_time).execute();
          if (id(alarm_on).state && id(alarm_time).has_state()) {
            auto set_alarm_time = id(alarm_time).state;
            if (set_alarm_time.length() == 5 &&
                isdigit(set_alarm_time[0]) && isdigit(set_alarm_time[1]) &&
                isdigit(set_alarm_time[3]) && isdigit(set_alarm_time[4])) {
              auto alarm_hour = std::stoi(set_alarm_time.substr(0, 2));
              auto alarm_minute = std::stoi(set_alarm_time.substr(3, 2));

              auto time_now = id(rtc).now();
              if (time_now.hour == alarm_hour && time_now.minute == alarm_minute) {
                auto action = id(alarm_action).current_option();
                if (action == "Play sound") {
                  id(timer_ringing).turn_on();
                } else if (action == "Send event") {
                  id(send_alarm_event).execute();
                } else if (action == "Sound and event") {
                  id(timer_ringing).turn_on();
                  id(send_alarm_event).execute();
                }
              }
            } else {
              ESP_LOGW("alarm", "Incorrect alarm time setting");
            }
          }

  - id: send_alarm_event
    then:
      - homeassistant.event:
          event: esphome.alarm_ringing

  - id: send_tts_uri_event
    parameters:
      tts_uri: string
    then:
      - homeassistant.event:
          event: esphome.tts_uri
          data:
            uri: !lambda return tts_uri;

  - id: send_stt_text_event
    parameters:
      stt_text: string
    then:
      - homeassistant.event:
          event: esphome.stt_text
          data:
            text: !lambda return stt_text;

  # A failed announcement URL is retried forever by the speaker media player:
  # the playlist item is only popped once a file has played, so a read error
  # restarts the same dead URL ~20x/second until something stops it. Drop the
  # announcement ourselves so the ring, the log and HA all recover.
  - id: abort_stalled_announcement
    mode: single
    then:
      - logger.log:
          level: ERROR
          format: "Announcement produced no audio for %dms, dropping it"
          args: ['${stalled_announcement_ms}']
      - lambda: |-
          id(external_media_player)
            ->make_call()
            .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
            .set_announcement(true)
            .perform();
      - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
      - script.execute: control_leds
      - delay: 2s
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
          timeout: 10s
      - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
      - script.execute: control_leds

  - id: publish_current_time
    mode: single
    then:
      - lambda: |-
          static std::string last_time_string = "";
          auto time_now = id(rtc).now();
          std::string current_time_string = time_now.strftime("%H:%M");
          if (current_time_string != last_time_string) {
            id(current_time).publish_state(current_time_string);
            last_time_string = current_time_string;
          }

interval:
  # Nothing is decoded while the reader is failing, so the announcement speaker
  # never starts - that, and not the media player state, is what tells a stuck
  # announcement apart from one that is simply still playing.
  - interval: 1s
    then:
      - lambda: |-
          const bool announcing =
              id(external_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
          if (!announcing || id(announcement_resampling_speaker)->is_running() ||
              id(timer_ringing).state) {
            id(stalled_announcement_for_ms) = 0;
            return;
          }
          id(stalled_announcement_for_ms) += 1000;
          if (id(stalled_announcement_for_ms) >= ${stalled_announcement_ms}) {
            id(stalled_announcement_for_ms) = 0;
            id(abort_stalled_announcement).execute();
          }

select:
  - platform: template
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    # Cutoffs are uint8, quantising probability 0.0-1.0 onto 0-255, so these are
    # roughly 0.85 / 0.69 / 0.20. This used to set them on okay_nabu, which is
    # no longer loaded - the entity moved but never followed the model, so it
    # had been adjusting nothing for a while.
    #
    # The internal "stop" model is deliberately left at its own default: it is
    # only enabled while the device is talking, and making it more sensitive
    # here would cut off replies, which is a different tradeoff from how eagerly
    # the device should wake up.
    on_value:
      lambda: |-
        if (x == "Slightly sensitive") {
          id(hey_jarvis).set_probability_cutoff(217);
        } else if (x == "Moderately sensitive") {
          id(hey_jarvis).set_probability_cutoff(176);
        } else if (x == "Very sensitive") {
          id(hey_jarvis).set_probability_cutoff(50);
        }
  - platform: logger
    id: logger_select
    name: Logger Level
    disabled_by_default: true
  - platform: template
    optimistic: true
    name: "Alarm action"
    id: alarm_action
    icon: mdi:bell-plus
    restore_value: true
    options:
      - "Play sound"
      - "Send event"
      - "Sound and event"
    initial_option: "Play sound"

switch:
  - platform: template
    id: diag_disable_mic
    name: "Diag: disable microphone"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF # default OFF = mic works as usual

  # Debug mode. The slot level sensors poll at 500ms, so four of them plus the
  # two AFE meters is twelve states a second into the recorder - fine while
  # bringing the audio path up, pure noise afterwards. This gates their
  # publishing rather than their existence, so they can be switched on from HA
  # when something needs diagnosing and cost nothing the rest of the time.
  - platform: template
    id: debug_audio
    name: "Debug: audio diagnostics"
    icon: mdi:bug-check
    optimistic: true
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF

  # A runtime A/B for the front end. Turning AEC off is the fastest way to tell
  # "the wake word got worse because the canceller is misconfigured" apart from
  # "the wake word got worse for some other reason" - flip it while music plays
  # and see whether detection changes.
  - platform: esp_afe
    esp_afe_id: afe_processor
    aec:
      name: "Echo Cancellation"
      entity_category: config
      restore_mode: RESTORE_DEFAULT_ON
    ns:
      name: "Noise Suppression"
      entity_category: config
      restore_mode: RESTORE_DEFAULT_ON

  - platform: gpio
    id: amp_enable_8
    name: Amplifier
    icon: mdi:speaker
    entity_category: config
    pin:
      tca9555: ioexp
      number: $amp_ctrl
      inverted: false
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: mic_mute_switch
    name: "Microphone Mute"
    icon: mdi:microphone-off
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(mic_is_muted);
    turn_on_action:
      - lambda: |-
          id(mic_is_muted) = true;
          id(audio_stack).set_mic_gain(0.0f);
      - script.execute:
          id: flash_ring
          r: 1.0
          g: 0.0
          b: 0.0
    turn_off_action:
      # Unmute restores the trim the number entity holds. It used to restore a
      # separate mic_gain_saved global that nothing ever wrote to, so unmuting
      # always jumped to that global's initial 32 dB regardless of the setting.
      - lambda: |-
          id(mic_is_muted) = false;
          id(audio_stack).set_mic_gain(powf(10.0f, id(mic_digital_trim_db).state / 20.0f));
      # The measured purple the voice phases use - the ring is listening again.
      - script.execute:
          id: flash_ring
          r: 1.0
          g: 0.11
          b: 0.945

  - platform: template
    id: mute_sound
    name: Mute-unmute sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - micro_wake_word.disable_model: stop
      - script.execute: disable_repeat
      - if:
          condition:
            media_player.is_announcing:
              id: external_media_player
          then:
            media_player.stop:
              id: external_media_player
              announcement: true
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 1.0s
      - mixer_speaker.apply_ducking:
          id: sendspin_mixing_input
          decibel_reduction: 0
          duration: 1.0s
      - script.execute: control_leds
    on_turn_on:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - mixer_speaker.apply_ducking:
          id: sendspin_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - micro_wake_word.enable_model: stop
      - script.execute: ring_timer
      - script.execute: control_leds
      - delay: 15min
      - switch.turn_off: timer_ringing

  - platform: template
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    id: alarm_on
    icon: mdi:bell-badge
    name: "Alarm on"
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds

number:
  # Gain staging changed when the audio stack took ownership of the codec.
  #
  # The analog PGA is still the right place to take level - it lifts the signal
  # above the ADC's noise floor, which is real SNR that no digital multiply can
  # recover. But it is now set once, at codec-open time, via the ES7210 block's
  # gain_db: 30.0 above, because the stack exposes no runtime setter for it.
  # That is the correct behaviour rather than a limitation: moving analog gain
  # under a running canceller shifts the mic-to-reference relationship that AEC
  # has already converged on, and it would take a moment to re-adapt every time
  # the slider moved.
  #
  # What remains adjustable is a digital trim applied AFTER the front end, which
  # is safe to change at any time. It is a different quantity from the old
  # "Mic Gain (ES7210 dB)" entity, so it deliberately carries a new id: sharing
  # one would let a device that had 30 stored in flash come back up applying
  # thirty decibels of digital gain (a x31.6 multiply) and clip everything.
  #
  # micro_wake_word's microphone source deliberately has no gain_factor at all
  # (default 1): with the PGA set correctly it does not need one, and mWW is the
  # consumer that suffers most from clipped audio.
  #
  # These use on_value, not set_action, and both need optimistic: true.
  # set_action only runs from control(), i.e. when something actively sets the
  # number - a value restored from flash was published to HA but never pushed
  # back into the hardware, so after a reboot HA showed one gain and the chip
  # ran another. on_value fires on every state publish, including the restore
  # in setup(), and optimistic: true is what makes control() publish at all
  # (without it the entity also never updated in HA when you moved the slider).
  - platform: template
    id: mic_digital_trim_db
    name: "Mic Digital Trim (post-AEC dB)"
    entity_category: config
    optimistic: true
    min_value: -20
    max_value: 20
    step: 1
    restore_value: true
    initial_value: 0
    # Muted wins, same as before: a device that boots muted stays muted.
    on_value:
      - lambda: |-
          id(audio_stack).set_mic_gain(id(mic_is_muted) ? 0.0f : powf(10.0f, x / 20.0f));
      - logger.log:
          format: "[MIC] Set post-AEC digital trim to %.0f dB"
          args: ["x"]
  # Live reference-slot switch, for finding the AEC reference without a reflash.
  #
  # Which TDM slot carries the playback reference is not something the schematic
  # answers: the ES7210 lays its channels across the frame as MIC1, MIC3, MIC2,
  # MIC4, so the reference sits in slot 1 even though it is wired to channel 3.
  # Getting that wrong is silent - AEC subtracts a microphone from a microphone
  # and simply does nothing, with no error anywhere.
  #
  # CHANGING THIS STOPS PLAYBACK. Switching the reference slot has to tear the
  # I2S bus down and bring it back, and whatever the media player was streaming
  # does not survive that - the hardware recovers, the audio does not resume.
  # So the measurement loop is: set the slot, THEN start playing, then read.
  # Comparing slots means restarting playback each time, and any reading taken
  # without audio actually playing is meaningless - with the room quiet, input
  # and output both sit near the noise floor and their difference is noise.
  #
  # Workflow: turn on "Debug: audio diagnostics", set this slot, start music,
  # then watch "Diag: AFE output RMS" against "Diag: AFE input volume". The
  # correct slot is the one where output drops ~20 dB below input while audio is
  # definitely playing. Check the input level looks like playback (about -33
  # dBFS here) and not idle (about -53) before believing any of it.
  #
  # set_action, not on_value: this must fire only when somebody actually moves
  # it, never from a restore or the initial publish, or the device would tear
  # the audio path down mid-boot. It is deliberately not restored across
  # reboots either - a stored wrong value would silently disable AEC on every
  # boot, which is exactly the failure this control exists to diagnose.
  - platform: template
    id: debug_ref_slot
    name: "Debug: AEC reference slot"
    icon: mdi:swap-horizontal
    entity_category: config
    min_value: 0
    max_value: 3
    step: 1
    restore_value: false
    initial_value: 1
    set_action:
      - lambda: id(debug_ref_slot).publish_state(x);
      # Writing the value it already holds must not tear anything down. HA and
      # scripts both re-send the current value freely, and an unguarded restart
      # here kills playback for no reason - which is exactly how the first
      # attempt at measuring this destroyed its own test conditions.
      - if:
          condition:
            lambda: return ((int) x) != id(active_ref_slot);
          then:
            # Release the mic before tearing the bus down - consumers are
            # reference-counted, so stop_and_wait will not stop a stack that
            # mWW is still holding.
            - micro_wake_word.stop:
            - delay: 150ms
            - lambda: |-
                const uint8_t slot = (uint8_t) id(debug_ref_slot).state;
                id(audio_stack).stop_and_wait();
                id(audio_stack).set_tdm_ref_slot(slot);
                id(audio_stack).start();
                id(active_ref_slot) = (int) slot;
                ESP_LOGW("aec", "[DEBUG] reference slot now %u - playback was stopped by the "
                                "bus restart, start audio again before reading AFE levels", slot);
            - delay: 250ms
            - micro_wake_word.start:

  - platform: template
    id: va_gain_factor
    name: "Gain Factor"
    entity_category: config
    optimistic: true
    min_value: 1
    max_value: 64
    step: 1
    restore_value: true
    initial_value: 4
    on_value:
      - lambda: |-
          id(va_mic).set_gain_factor(x);
      - logger.log:
          format: "[MIC] Set gain factor to %.0f"
          args: ["x"]
  # REMOVED: a "Noise Suppression" number driving va.set_noise_suppression_level().
  # That value is only packed into the audio_settings protobuf and sent to HA;
  # it has no device-side effect, and HA's esphome integration now takes
  # audio_settings in handle_pipeline_start() and never reads it again. It never
  # touched the wake word in any case - micro_wake_word runs entirely on-device,
  # upstream of anything the server does. Same story for auto_gain and
  # volume_multiplier in the voice_assistant block, which are left at their
  # defaults rather than exposed as controls that do nothing.
  - platform: template
    id: led_ring_brightness
    name: "LED Ring Brightness"
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0.4
    max_value: 1.0
    step: 0.05
    initial_value: 0.8
    mode: slider
    # Re-run the state machine rather than pushing the new brightness at the
    # light directly: mute deliberately ignores this slider and sits at 12%, and
    # a direct turn_on here would drag it up to the 0.4 minimum until something
    # else refreshed the ring.
    on_value:
      - if:
          condition:
            light.is_on: status_ring
          then:
            - script.execute: control_leds

  # Minimum brightness for the Mic Reactive effect on Status Ring: the ring
  # pulses with the room's mic level but never drops below this floor, so a
  # quiet room keeps the stage's color faintly visible instead of near-black.
  # The effect reads it every frame (60ms), so moving the slider retunes it
  # live. 0.25 = Listening's Mic Reactive at 25% minimum.
  - platform: template
    id: mic_reactive_ground
    name: "Mic Reactive Ground"
    entity_category: config
    optimistic: true
    min_value: 0.0
    max_value: 1.0
    step: 0.05
    restore_value: true
    initial_value: 0.25
    mode: slider

sensor:
  - platform: template
    id: next_timer
    name: "Next timer"
    update_interval: never
    disabled_by_default: true
    device_class: duration
    unit_of_measurement: s
    icon: "mdi:timer"
    accuracy_decimals: 0

  # Headroom instrumentation. Before adding anything heavy (bluetooth_proxy,
  # another wake word model), take a baseline from these and compare after.
  # "Heap max block" is the one that matters: BLE init fails on the largest
  # contiguous block, not on total free heap, so `free` can look healthy while
  # `block` has already fallen below what the stack needs.
  - platform: debug
    free:
      name: "Heap free"
      entity_category: diagnostic
    block:
      name: "Heap max block"
      entity_category: diagnostic
    min_free:
      name: "Heap min free"
      entity_category: diagnostic
      disabled_by_default: true
    psram:
      name: "PSRAM free"
      entity_category: diagnostic
    loop_time:
      name: "Loop time"
      entity_category: diagnostic

  # Reads the SoC die, which sits well above room temperature and climbs with
  # radio load. Useful as a trend, not as a thermometer.
  - platform: internal_temperature
    name: "Internal temperature"
    entity_category: diagnostic
    disabled_by_default: true

  - platform: wifi_signal
    name: "WiFi signal"
    entity_category: diagnostic
    update_interval: 60s

  # REMOVED: a sound_level sensor tapping i2s_mics. passive: true keeps it from
  # starting the mic, but it still registers a second MicrophoneSource on the
  # same capture, so every audio chunk gets copied and RMS/peak-summed on the
  # mic's delivery path before micro_wake_word sees it. mWW feeds a streaming
  # model - it degrades from dropped or late frames, not just from bad gain -
  # and this was the only change to the audio path in this config, so it is the
  # prime suspect for wake-word detection getting worse. Do not re-add it
  # without A/B-ing detection rate; use "Ambient sound level" from a separate
  # device if you want room-noise telemetry.
  #
  # Kept commented out as a gain-tuning tool. Uncomment, flash, adjust the
  # ES7210 gain_db so that "Peak sound level" reads about -6 to -3 dB while you
  # talk at the device from where you normally stand - that is the ADC's full
  # scale, so 0 dB is already clipping - then comment it out again and reflash.
  # Leaving it in while judging wake-word performance defeats the point of the
  # A/B.
  #
  # - platform: sound_level
  #   microphone:
  #     microphone: clean_mic
  #     channels: 0
  #   passive: true
  #   measurement_duration: 1000ms
  #   rms:
  #     name: "Ambient sound level"
  #     id: ambient_sound_level
  #   peak:
  #     name: "Peak sound level"
  #     id: peak_sound_level

  # Bring-up instruments for the TDM slot mapping. The slot assignments in the
  # esp_audio_stack block are read off the schematic, not measured, and the
  # whole thing is silently useless if they are wrong: AEC would be subtracting
  # a mic from a mic. These answer it empirically.
  #
  # Play music with nobody talking: slot 2 should move and slots 0/1 should not.
  # Then talk with nothing playing: slots 0 and 1 should move and slot 2 should
  # not. Slot 3 should sit still throughout - nothing drives MIC4 on this board.
  #
  # Remove these once the mapping is confirmed; they are four more states a
  # minute into the recorder for no ongoing benefit.
  # All six are gated on the debug_audio switch: the lambda returning an empty
  # optional drops the reading, so nothing publishes while debug is off.
  - platform: esp_audio_stack
    esp_audio_stack_id: audio_stack
    tdm_slot_levels:
      - slot: 0
        name: "Diag: TDM slot 0 (MIC1)"
        entity_category: diagnostic
        filters: &debug_gated
          - lambda: |-
              if (!id(debug_audio).state) return {};
              return x;
      - slot: 1
        name: "Diag: TDM slot 1 (MIC3 = AEC ref)"
        entity_category: diagnostic
        filters: *debug_gated
      - slot: 2
        name: "Diag: TDM slot 2 (MIC2)"
        entity_category: diagnostic
        filters: *debug_gated
      - slot: 3
        name: "Diag: TDM slot 3 (MIC4, unpopulated)"
        entity_category: diagnostic
        filters: *debug_gated

  - platform: esp_afe
    esp_afe_id: afe_processor
    # The pair that tells you whether AEC is doing anything: with the speaker
    # playing, output_rms should sit well below input_volume. About 20 dB below
    # on this board when the reference slot is right; within a couple of dB
    # means the canceller is subtracting the wrong channel.
    input_volume:
      name: "Diag: AFE input volume"
      entity_category: diagnostic
      filters: *debug_gated
    output_rms:
      name: "Diag: AFE output RMS"
      entity_category: diagnostic
      filters: *debug_gated

text_sensor:
  - platform: template
    id: next_timer_name
    name: "Next timer name"
    icon: "mdi:timer"
    disabled_by_default: true
  - platform: template
    name: "Alarm time"
    id: alarm_time
    icon: mdi:bell-ring
  - platform: template
    name: "Current device time"
    id: current_time
    icon: mdi:clock
  - platform: debug
    device:
      name: "Device info"
      entity_category: diagnostic
      disabled_by_default: true
    reset_reason:
      name: "Reset reason"
      entity_category: diagnostic

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
    internal: true
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:restart"

binary_sensor:
  - platform: gpio
    id: key1_button
    name: "Key1"
    pin:
      tca9555: ioexp
      number: 9
      inverted: true
    on_press:
      - media_player.volume_down: external_media_player

  - platform: gpio
    id: key2_button
    name: "Key2"
    pin:
      tca9555: ioexp
      number: 10
      inverted: true
    on_press:
      - media_player.toggle: external_media_player

  - platform: gpio
    id: key3_button
    name: "Key3"
    pin:
      tca9555: ioexp
      number: 11
      inverted: true
    on_press:
      - media_player.volume_up: external_media_player
