    options:
      - "Play sound"
      - "Send event"
      - "Sound and event"
    initial_option: "Play sound"
    on_value:
      then:
        - lambda: |-
            id(saved_alarm_action) = x;

  # Per-stage LED ring effects. Colour per stage is fixed in control_leds -
  # see the comment there - but which animation plays is user-configurable
  # and persisted, same restore_value pattern as Alarm action above. Options
  # deliberately exclude "off": an "off" indicator for e.g. Listening would
  # read as the device having gone unresponsive rather than as a choice.
