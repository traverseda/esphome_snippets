# ---------------------------------------------------------------------------
# Waveshare ESP32-S3 audio board as a Home Assistant voice satellite.
#
# This is a PACKAGE. Your device config supplies esphome: name:, the wifi
# credentials, api: encryption:, and ota:; this file supplies the audio
# hardware, voice assistant, LED ring, timers and alarm.
#
#   packages:
#     speaker: github://traverseda/esphome_snippets/smart-speak.yaml@main
#
# Your config MUST keep these ids, which this package's scripts reference:
#   wifi:  id: wifi_id      (control_leds reads the connection state)
#   api:   id: api_id       (same)
# The api: block here also defines actions and client-connect handlers, so
# merge into it rather than replacing it.
#
# Requires ESPHome 2026.7.0+ and the esp-idf framework. The audio path is built
# on the esphome-audio-stack external component rather than ESPHome's own
# i2s_audio, so that AEC can run against the board's hardware echo reference -
# see the audio section below. That component is young; pin this package to a
# tag rather than tracking main if you care about reproducible builds.
# ---------------------------------------------------------------------------

# The BLE beacon proxy used to be pulled in here. It cannot coexist with the
# AEC front end on this chip - not for want of PSRAM, but because the I2S TDM
# DMA descriptors are the last thing allocated and can only live in internal
# DMA-capable memory. Bluedroid takes about 134 KB of internal RAM, which left
# 21 KB free and a 13 KB largest block against the ~41 KB of TX+RX descriptors
# the 4-slot TDM frame needs; I2S init failed with ESP_ERR_NO_MEM and both
# audio directions latched into an error state.
#
# Beacons therefore need to come from a device that is not also doing voice.
# ble-beacon-proxy.yaml is unchanged and still works on its own.

substitutions:
  # Phases of the Voice Assistant
  voice_assist_idle_phase_id: '1' # ready to be triggered by a wake word
  voice_assist_waiting_for_command_phase_id: '2' # waiting for a voice command (after being triggered by the wake word)
  voice_assist_listening_for_command_phase_id: '3' # listening for a voice command
  voice_assist_thinking_phase_id: '4' # processing the command
  voice_assist_replying_phase_id: '5' # replying to the command
  voice_assist_not_ready_phase_id: '10' # not ready
  voice_assist_error_phase_id: '11' #encountered an error

  i2s_mclk: GPIO12
  i2s_bclk: GPIO13 #SCLK
  i2s_lrclk: GPIO14 #LRCK/WS

  amp_ctrl: 8 #Extended IO pin that controls the PA_EN on the TCA9555
  i2c_scl: GPIO10
  i2c_sda: GPIO11
  rtc_int: 5 #ExtendedIO

  # The mic-channel lookup, the per-bus i2s_mode/bps/apll/mclk knobs and
  # which_mic are all gone: esp_audio_stack owns the bus and the codecs now, and
  # takes its rates and slot layout from its own block below.

  led_num: '7' # WS2812 ring leds

  # How long an announcement may sit in ANNOUNCING without a single decoded
  # sample before the watchdog gives up on it. Keep this above 30s: a slow
  # header fetch is retried six times at 5s each before the reader errors, and
  # audio that does eventually arrive should never be cut off.
  stalled_announcement_ms: '35000'

esphome:
  # esp_audio_stack is released against the 2026.7 component API.
  min_version: 2026.7.0
  on_boot:
    # Runs once ever, before priority 375 below makes the first real
    # script.execute: control_leds call. Seeds each per-stage light widget's
    # default color and brightness (see globals: stage_lights_seeded and the
    # light: platform: rgb widgets below) so a widget that has never been
    # touched by a user shows the same color control_leds used to hardcode
    # for that stage, instead of whatever an ESPHome light defaults to
    # unconfigured (full white). Turns each on with its default then
    # immediately back off - the color/brightness survive being turned off
    # (same as any HA light remembers a color while off) and persist in the
    # widget's NVS via restore_mode: RESTORE_AND_OFF; the brief on is what
    # lets a value actually get set. Effects are not seeded here: a light's
    # effect is cleared the moment it turns off, so each stage's effect
    # instead lives in the effect_* globals (initial_value below, updated by
    # each widget's on_state and re-applied by control_leds). Guarded by the
    # seeded flag so it never runs again and never overwrites a real choice.
    - priority: 400
      then:
        # Feed Mic Reactive from the live mic stream instead of the
        # divider-throttled TDM RMS probe (~4 Hz). ESPHome's standard
        # microphone data callback fires once per delivered frame (~30 Hz,
        # post-AEC/NS) whenever the mic is capturing, which is exactly the
        # "how well can it hear me" signal - the RMS lands in
        # id(mic_audio_level) and the effect reads it every frame.
        - lambda: |-
            static bool mic_cb_registered = false;
            if (!mic_cb_registered) {
              mic_cb_registered = true;
              id(clean_mic).add_data_callback([](const std::vector<uint8_t> &data) {
                const int16_t *samples = reinterpret_cast<const int16_t *>(data.data());
                const size_t n = data.size() / 2;
                float sum = 0.0f;
                for (size_t i = 0; i < n; i++) {
                  const float v = samples[i];
                  sum += v * v;
                }
                const float rms = n > 0 ? sqrtf(sum / n) : 0.0f;
                id(mic_audio_level) = 20.0f * log10f((rms + 1.0f) / 32768.0f);
              });
            }
        - lambda: |-
            if (!id(stage_lights_seeded)) {
              auto seed = [&](light::LightState *lt, float r, float g, float b,
                               float brightness) {
                auto call = lt->turn_on();
                call.set_rgb(r, g, b);
                call.set_brightness(brightness);
                call.perform();
                lt->turn_off().perform();
              };
              seed(id(light_starting_up), 0.9f, 0.1f, 0.85f, 1.0f);
              seed(id(light_idle), 1.0f, 1.0f, 1.0f, 0.01f);
              seed(id(light_waiting_for_command), 1.0f, 0.11f, 0.945f, 1.0f);
              seed(id(light_listening_for_command), 1.0f, 0.11f, 0.945f, 1.0f);
              seed(id(light_thinking), 1.0f, 0.11f, 0.945f, 1.0f);
              seed(id(light_replying), 0.0f, 0.35f, 1.0f, 1.0f);
              seed(id(light_error), 1.0f, 0.0f, 0.0f, 1.0f);
              seed(id(light_not_ready), 1.0f, 0.0f, 0.0f, 1.0f);
              seed(id(light_muted), 1.0f, 0.0f, 0.0f, 0.15f);
              seed(id(light_timers_active), 0.0f, 1.0f, 0.2f, 1.0f);
              seed(id(light_ringing), 0.0f, 1.0f, 0.2f, 1.0f);
              seed(id(light_playing_music), 16.0f / 255.0f, 1.0f, 0.0f, 1.0f);
              // Effect defaults live in the effect_* globals' own
              // initial_value above and persist from there; nothing to write
              // here. A widget's effect can't be seeded onto the light
              // itself - it would be cleared the instant it turns off.
              id(stage_lights_seeded) = true;
            }
    - priority: -100
      then:
        - if:
            condition:
              switch.is_on: diag_disable_mic
            then:
              - logger.log: "Mic ENABLED"
            else:
              - logger.log: "Mic DISABLED for diagnostics"
              - micro_wake_word.stop:
              - voice_assistant.stop:
              - microphone.stop_capture: clean_mic
    - priority: 375
      then:
        - sensor.template.publish:
            id: next_timer
            state: -1
        - script.execute: control_leds
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: control_leds
    - priority: -100
      then:
        - lambda: |-
            id(alarm_time).publish_state(id(saved_alarm_time));
        - lambda: |-
            setenv("TZ", id(saved_time_zone).c_str(), 1);
            tzset();
        # Seed the system clock from the onboard RTC before HA is reachable, so
        # the alarm survives an HA restart. Runs after the TZ restore above so
        # the first published time is already local. With no backup cell the
        # chip's oscillator-stop flag is set after a power cut and the component
        # declines to sync, leaving HA the only source - i.e. today's behaviour.
        - pcf85063.read_time: hw_rtc
        - script.execute: publish_current_time

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      # Kept even though the BLE package is gone: harmless with Bluetooth
      # disabled, and it means re-adding a BLE package later does not silently
      # revert to allocating Bluedroid's environment from internal RAM.
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y" # TLS1.3 support isn't enabled by default in IDF 5.1.5

psram:
  mode: octal
  speed: 80MHz

# Sendspin hub, plus its media_source. Still not wired to a speaker/media_player
# yet - that is the next step. See esphome.io/components/sendspin/ - ESP32-only,
# needs mDNS and TCP 8928 reachable to the Sendspin server.
sendspin:
  id: sendspin_hub

media_source:
  - platform: sendspin
    id: sendspin_media_source

# Credentials (and the fallback ap:) come from your own config; this block
# only claims the id the LED scripts read and the connection-state triggers.
wifi:
  id: wifi_id
  power_save_mode: none # Disable power saving for better performance
  reboot_timeout: 10min # Prevent unnecessary reboots
  on_connect:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds
  on_disconnect:
    - script.execute: control_leds

# This interval drives the debug sensors below, not just the log line - at 5s
# they'd write seven states a minute each into HA's recorder for no benefit.
debug:
  update_interval: 60s

logger:
  level: DEBUG

# encryption: key: comes from your own config and merges into this block.
api:
  id: api_id
  actions:
    - action: start_va
      then:
        - voice_assistant.start
    - action: stop_va
      then:
        - voice_assistant.stop
    - action: set_alarm_time
      variables:
        alarm_time_hh_mm: string
      then:
        - lambda: |-
            if (alarm_time_hh_mm.length() == 5 &&
              isdigit(alarm_time_hh_mm[0]) && isdigit(alarm_time_hh_mm[1]) &&
              isdigit(alarm_time_hh_mm[3]) && isdigit(alarm_time_hh_mm[4])) {
                id(alarm_time).publish_state(alarm_time_hh_mm);
                id(saved_alarm_time) = alarm_time_hh_mm;
              }
    - action: set_time_zone
      variables:
        posix_time_zone: string
      then:
        - lambda: |-
            setenv("TZ", posix_time_zone.c_str(), 1);
            tzset();
            id(saved_time_zone) = posix_time_zone;
            id(publish_current_time).execute();
  on_client_connected:
    - script.execute: control_leds
  on_client_disconnected:
    - script.execute: control_leds

i2c:
  - id: internal_i2c
    sda: GPIO11
    scl: GPIO10
    scan: true
    frequency: 100kHz

# I/O Expander that controls the amplifier enable pin
tca9555:
  id: ioexp
  i2c_id: internal_i2c
  address: 0x20

time:
  - platform: homeassistant
    id: rtc
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - script.execute: check_alarm
    on_time_sync:
      - script.execute: publish_current_time
      # HA stays authoritative; push its time down so the chip is correct for
      # the next cold boot. Declines to write if system time is itself invalid.
      - pcf85063.write_time:
          id: hw_rtc

  # Onboard PCF85063 (I2C 0x51), kept as a fallback rather than a peer:
  # update_interval: never, because polling would let the chip's drift overwrite
  # HA's accurate time every 15 minutes. Read once at boot, written on HA sync.
  # Absent or unreadable, it marks itself failed and nothing else is affected.
  - platform: pcf85063
    id: hw_rtc
    i2c_id: internal_i2c
    address: 0x51
    update_interval: never

light:
  - platform: esp32_rmt_led_strip
    id: status_ring
    name: "Status Ring"
    pin: GPIO38
    num_leds: ${led_num}
    chipset: WS2812
    rgb_order: RGB
    default_transition_length: 150ms
    effects:
      - pulse:
          name: "Pulse Slow"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 2000ms
          update_interval: 3000ms
      - pulse:
          name: "Pulse Medium"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 600ms
          update_interval: 1200ms
      - pulse:
          name: "Pulse Fast"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 300ms
          update_interval: 600ms
      - addressable_rainbow:
          name: "Rainbow Slow"
          speed: 6
          width: 7
      - addressable_color_wipe:
          name: "Wipe"
      # A single lit pixel chasing around the ring with a short fading tail.
      # Rotation reads as "busy" at a glance, which no pulse speed does.
      - addressable_lambda:
          name: "Comet"
          update_interval: 70ms
          lambda: |-
            static int head = 0;
            if (initial_run) head = 0;
            const int n = it.size();
            for (int i = 0; i < n; i++) {
              const int behind = (head - i + n) % n;  // 0 at the head
              float level;
              switch (behind) {
                case 0: level = 1.00f; break;
                case 1: level = 0.40f; break;
                case 2: level = 0.12f; break;
                default: level = 0.02f; break;
              }
              it[i] = Color((uint8_t) (current_color.red * level),
                            (uint8_t) (current_color.green * level),
                            (uint8_t) (current_color.blue * level));
            }
            head = (head + 1) % n;
      # Whole-ring brightness pulsing with how loud the speaker is playing.
      # Reads TDM slot 1, the AEC reference tap wired to the ES8311's output
      # (see the esp_audio_stack block below) - an electrical copy of what is
      # being played, not a microphone, so it is unaffected by room acoustics
      # or how loud the mics happen to be. -60/-19 dBFS are this board's
      # measured idle/playing figures for that slot, same numbers the
      # tdm_slot_levels sensors below are commented against.
      #
      # get_tdm_slot_level_dbfs() is a lock-free atomic read updated by the
      # audio task on every RX frame (divided by 8, so a few times a second),
      # independent of whether any tdm_slot_levels sensor is enabled or the
      # "Debug: audio diagnostics" switch is on - both only gate what gets
      # published to HA, not whether the level itself is computed.
      - addressable_lambda:
          name: "Sound Reactive"
          update_interval: 60ms
          lambda: |-
            static float level = 0.0f;
            if (initial_run) level = 0.0f;
            float target = (id(audio_stack).get_tdm_slot_level_dbfs(1) + 60.0f) / 45.0f;
            if (target < 0.0f) target = 0.0f;
            if (target > 1.0f) target = 1.0f;
            level += (target - level) * 0.6f;  // one-pole smoothing, tight enough to not read as laggy
            const float b = 0.05f + level * 0.95f;  // 0.05 floor so the ring outline stays visible when quiet
            const int n = it.size();
            for (int i = 0; i < n; i++) {
              it[i] = Color((uint8_t) (current_color.red * b),
                            (uint8_t) (current_color.green * b),
                            (uint8_t) (current_color.blue * b));
            }
      # Same whole-ring brightness pulse as Sound Reactive above, but for the
      # room instead of the speaker. Unlike Sound Reactive (which taps the
      # ~4 Hz TDM probe) this reads the live mic stream via the standard
      # microphone data callback registered in on_boot: post-AEC/NS audio at
      # the frame rate (~30 Hz), so it tracks speech, not a slow snapshot.
      # The reactive level is signal-above-noise, not absolute volume: a noise
      # floor is tracked as the sustained quietest level, and the ring
      # brightens with how far the current level clears that floor - i.e. how
      # well it can hear you. That is also inherently independent of a fixed
      # mic pre-amp: uniform gain lifts signal and noise together, so SNR is
      # unchanged. The floor falls fast toward any quieter signal (a pause
      # reads as the room) and rises very slowly, so a persistently louder
      # room re-establishes the baseline over tens of seconds without speech
      # bursts dragging it up. The floor of the *brightness* (the minimum the
      # ring shows when nobody is talking) is the "Mic Reactive Ground" number
      # entity. Tune the SNR range against "Diag: TDM slot 0/2" with "Debug:
      # audio diagnostics" on.
      - addressable_lambda:
          name: "Mic Reactive"
          update_interval: 60ms
          lambda: |-
            static float level = 0.0f;
            static float floor_dbfs = -55.0f;
            if (initial_run) {
              level = 0.0f;
              floor_dbfs = -55.0f;
            }
            const float dbfs = id(mic_audio_level);
            if (dbfs < floor_dbfs) {
              floor_dbfs += 0.5f * (dbfs - floor_dbfs);
            } else {
              floor_dbfs += 0.002f * (dbfs - floor_dbfs);
            }
            float target = (dbfs - floor_dbfs) / 25.0f;
            if (target < 0.0f) target = 0.0f;
            if (target > 1.0f) target = 1.0f;
            level += (target - level) * 0.6f;
            const float ground = id(mic_reactive_ground).state;
            const float b = ground + level * (1.0f - ground);
            const int n = it.size();
            for (int i = 0; i < n; i++) {
              it[i] = Color((uint8_t) (current_color.red * b),
                            (uint8_t) (current_color.green * b),
                            (uint8_t) (current_color.blue * b));
            }

  # Per-stage light widgets: same shape as Status Ring's own card above
  # (color wheel, brightness, power, an effect chip) - one per control_leds
  # state. Turning one on (manually, or control_leds calling
  # id(light_X).turn_on() for a real state change) makes it the stage shown
  # on the real ring; only one is ever on at a time, enforced by each
  # widget's own on_state below - see the comment there for why that's
  # inline per-widget rather than a shared script.
  #
  # Software-only, backed by three no-op template outputs each (see
  # output: below) - there is no light: platform: template in ESPHome
  # (unlike select/number/switch, which do have one), so platform: rgb
  # over throwaway outputs is the documented way to get a color-wheel light
  # with nothing physical behind it.
  #
  # Effects: Pulse Slow/Medium/Fast really run (harmlessly, into unused
  # outputs). Rainbow Slow/Wipe/Comet/Sound Reactive/Mic Reactive are
  # no-op stand-ins with the same names - actually rendering any of those
  # needs per-pixel access to a real strip, which only Status Ring has. The
  # names exist so the dropdown offers the full catalog, but a widget's
  # effect can't be the source of truth: ESPHome clears a light's effect the
  # moment it turns off. Each on_state instead mirrors an effect index that
  # persists in the effect_* globals (see globals: below) - seeded with the
  # defaults, updated from the widget's on_state whenever it is on (including
  # a deliberate None), and re-applied by control_leds on activation - and
  # Status Ring's own effects: list (above) declares the same eight names in
  # the same order, so the index maps straight across.
  - platform: rgb
    id: light_starting_up
    name: "LED: Starting up"
    entity_category: config
    icon: mdi:led-strip-variant
    red: color_starting_up_r_out
    green: color_starting_up_g_out
    blue: color_starting_up_b_out
    restore_mode: RESTORE_AND_OFF
    default_transition_length: 0ms
    effects: &stage_effects
      - pulse:
          name: "Pulse Slow"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 2000ms
          update_interval: 3000ms
      - pulse:
          name: "Pulse Medium"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 600ms
          update_interval: 1200ms
      - pulse:
          name: "Pulse Fast"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 300ms
          update_interval: 600ms
      - lambda:
          name: "Rainbow Slow"
          update_interval: 1s
          lambda: 'return;'
      - lambda:
          name: "Wipe"
          update_interval: 1s
          lambda: 'return;'
      - lambda:
          name: "Comet"
          update_interval: 1s
          lambda: 'return;'
      - lambda:
          name: "Sound Reactive"
          update_interval: 1s
          lambda: 'return;'
      - lambda:
          name: "Mic Reactive"
          update_interval: 1s
          lambda: 'return;'
    # Turns off the other 11 widgets and mirrors this one's color/effect/
    # brightness onto Status Ring - direct and inline, not routed through a
    # shared script. This used to call a shared activate_stage script
    # (mode: queued) with this widget's own key; that broke under rapid
    # state changes because queued mode has a small fixed queue depth and
    # silently drops calls once it's full - two widgets could end up on at
    # once because the second one's "turn the other off" call just never
    # ran. A shared script is a shared resource multiple triggers can
    # contend over; each widget doing its own exclusion here has nothing to
    # contend over, so there's nothing to drop. Every other widget has the
    # identical block, just naming the other 11.
    on_state:
      - if:
          condition:
            light.is_on: light_starting_up
          then:
            - lambda: |-
                if (id(light_idle).remote_values.is_on()) id(light_idle).turn_off().perform();
                if (id(light_waiting_for_command).remote_values.is_on()) id(light_waiting_for_command).turn_off().perform();
                if (id(light_listening_for_command).remote_values.is_on()) id(light_listening_for_command).turn_off().perform();
                if (id(light_thinking).remote_values.is_on()) id(light_thinking).turn_off().perform();
                if (id(light_replying).remote_values.is_on()) id(light_replying).turn_off().perform();
                if (id(light_error).remote_values.is_on()) id(light_error).turn_off().perform();
                if (id(light_not_ready).remote_values.is_on()) id(light_not_ready).turn_off().perform();
                if (id(light_muted).remote_values.is_on()) id(light_muted).turn_off().perform();
                if (id(light_timers_active).remote_values.is_on()) id(light_timers_active).turn_off().perform();
                if (id(light_ringing).remote_values.is_on()) id(light_ringing).turn_off().perform();
                if (id(light_playing_music).remote_values.is_on()) id(light_playing_music).turn_off().perform();
                auto call = id(status_ring).turn_on();
                call.set_rgb(id(light_starting_up).remote_values.get_red(),
                             id(light_starting_up).remote_values.get_green(),
                             id(light_starting_up).remote_values.get_blue());
                call.set_brightness(id(light_starting_up).remote_values.get_brightness());
                auto idx = id(light_starting_up).get_current_effect_index();
                if (idx != 0 || id(last_on_effect_starting_up) != 0) {
                  id(effect_starting_up) = idx;
                  id(last_on_effect_starting_up) = idx;
                  call.set_effect(idx);
                } else {
                  call.set_effect((uint32_t) id(effect_starting_up));
                }
                call.perform();
          else:
            # A 0 here just means the widget was off (ESPHome clears a light's
            # effect the moment it turns off), so its fresh-turn-on tracker
            # resets too - otherwise the next plain turn-on would read as a
            # deliberate "None" and wipe the persisted choice.
            - lambda: id(last_on_effect_starting_up) = 0;
            # Fallback only when nothing else is taking over: if another
            # widget just came on (this turn-off was the exclusion doing its
            # job), re-running control_leds would fight the manual selection
            # and turn it back off. Only when every widget is off - a real
            # stage ending with nothing replacing it - re-evaluate to the
            # still-active stage or Idle.
            - if:
                condition:
                  lambda: |-
                    return !(id(light_starting_up).remote_values.is_on()
                          || id(light_idle).remote_values.is_on()
                          || id(light_waiting_for_command).remote_values.is_on()
