switch:
  - platform: template
    id: diag_disable_mic
    name: "Diag: disable microphone"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF # default OFF = mic works as usual

  # Debug mode. The slot level sensors poll at 500ms, so four of them plus the
  # two AFE meters is twelve states a second into the recorder - fine while
  # bringing the audio path up, pure noise afterwards. This gates their
  # publishing rather than their existence, so they can be switched on from HA
  # when something needs diagnosing and cost nothing the rest of the time.
  - platform: template
    id: debug_audio
    name: "Debug: audio diagnostics"
    icon: mdi:bug-check
    optimistic: true
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF

  # A runtime A/B for the front end. Turning AEC off is the fastest way to tell
  # "the wake word got worse because the canceller is misconfigured" apart from
  # "the wake word got worse for some other reason" - flip it while music plays
  # and see whether detection changes.
  - platform: esp_afe
    esp_afe_id: afe_processor
    aec:
      name: "Echo Cancellation"
      entity_category: config
      restore_mode: RESTORE_DEFAULT_ON
    ns:
      name: "Noise Suppression"
      entity_category: config
      restore_mode: RESTORE_DEFAULT_ON

  - platform: gpio
    id: amp_enable_8
    name: Amplifier
    icon: mdi:speaker
    entity_category: config
    pin:
      tca9555: ioexp
      number: $amp_ctrl
      inverted: false
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: mic_mute_switch
    name: "Microphone Mute"
    icon: mdi:microphone-off
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(mic_is_muted);
    turn_on_action:
      - lambda: |-
          id(mic_is_muted) = true;
          id(audio_stack).set_mic_gain(0.0f);
      - script.execute:
          id: flash_ring
          r: 1.0
          g: 0.0
          b: 0.0
    turn_off_action:
      # Unmute restores the trim the number entity holds. It used to restore a
      # separate mic_gain_saved global that nothing ever wrote to, so unmuting
      # always jumped to that global's initial 32 dB regardless of the setting.
      - lambda: |-
          id(mic_is_muted) = false;
          id(audio_stack).set_mic_gain(powf(10.0f, id(mic_digital_trim_db).state / 20.0f));
      # The measured purple the voice phases use - the ring is listening again.
      - script.execute:
          id: flash_ring
          r: 1.0
          g: 0.11
          b: 0.945

  - platform: template
    id: mute_sound
    name: Mute-unmute sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - micro_wake_word.disable_model: stop
      - script.execute: disable_repeat
      - if:
          condition:
            media_player.is_announcing:
              id: external_media_player
          then:
            media_player.stop:
              id: external_media_player
              announcement: true
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 1.0s
      - mixer_speaker.apply_ducking:
          id: sendspin_mixing_input
          decibel_reduction: 0
          duration: 1.0s
      - script.execute: control_leds
    on_turn_on:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - mixer_speaker.apply_ducking:
          id: sendspin_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - micro_wake_word.enable_model: stop
      - script.execute: ring_timer
      - script.execute: control_leds
      - delay: 15min
      - switch.turn_off: timer_ringing

  - platform: template
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    id: alarm_on
    icon: mdi:bell-badge
    name: "Alarm on"
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds

number:
  # Gain staging changed when the audio stack took ownership of the codec.
  #
  # The analog PGA is still the right place to take level - it lifts the signal
  # above the ADC's noise floor, which is real SNR that no digital multiply can
  # recover. But it is now set once, at codec-open time, via the ES7210 block's
  # gain_db: 30.0 above, because the stack exposes no runtime setter for it.
  # That is the correct behaviour rather than a limitation: moving analog gain
  # under a running canceller shifts the mic-to-reference relationship that AEC
  # has already converged on, and it would take a moment to re-adapt every time
  # the slider moved.
  #
  # What remains adjustable is a digital trim applied AFTER the front end, which
  # is safe to change at any time. It is a different quantity from the old
  # "Mic Gain (ES7210 dB)" entity, so it deliberately carries a new id: sharing
  # one would let a device that had 30 stored in flash come back up applying
  # thirty decibels of digital gain (a x31.6 multiply) and clip everything.
  #
  # micro_wake_word's microphone source deliberately has no gain_factor at all
  # (default 1): with the PGA set correctly it does not need one, and mWW is the
  # consumer that suffers most from clipped audio.
  #
  # These use on_value, not set_action, and both need optimistic: true.
  # set_action only runs from control(), i.e. when something actively sets the
  # number - a value restored from flash was published to HA but never pushed
  # back into the hardware, so after a reboot HA showed one gain and the chip
  # ran another. on_value fires on every state publish, including the restore
  # in setup(), and optimistic: true is what makes control() publish at all
  # (without it the entity also never updated in HA when you moved the slider).
  - platform: template
    id: mic_digital_trim_db
    name: "Mic Digital Trim (post-AEC dB)"
    entity_category: config
    optimistic: true
    min_value: -20
    max_value: 20
    step: 1
    restore_value: true
    initial_value: 0
    # Muted wins, same as before: a device that boots muted stays muted.
    on_value:
      - lambda: |-
          id(audio_stack).set_mic_gain(id(mic_is_muted) ? 0.0f : powf(10.0f, x / 20.0f));
      - logger.log:
          format: "[MIC] Set post-AEC digital trim to %.0f dB"
          args: ["x"]
  # Live reference-slot switch, for finding the AEC reference without a reflash.
  #
  # Which TDM slot carries the playback reference is not something the schematic
  # answers: the ES7210 lays its channels across the frame as MIC1, MIC3, MIC2,
  # MIC4, so the reference sits in slot 1 even though it is wired to channel 3.
  # Getting that wrong is silent - AEC subtracts a microphone from a microphone
  # and simply does nothing, with no error anywhere.
  #
  # CHANGING THIS STOPS PLAYBACK. Switching the reference slot has to tear the
  # I2S bus down and bring it back, and whatever the media player was streaming
  # does not survive that - the hardware recovers, the audio does not resume.
  # So the measurement loop is: set the slot, THEN start playing, then read.
  # Comparing slots means restarting playback each time, and any reading taken
  # without audio actually playing is meaningless - with the room quiet, input
  # and output both sit near the noise floor and their difference is noise.
  #
  # Workflow: turn on "Debug: audio diagnostics", set this slot, start music,
  # then watch "Diag: AFE output RMS" against "Diag: AFE input volume". The
  # correct slot is the one where output drops ~20 dB below input while audio is
  # definitely playing. Check the input level looks like playback (about -33
  # dBFS here) and not idle (about -53) before believing any of it.
  #
  # set_action, not on_value: this must fire only when somebody actually moves
  # it, never from a restore or the initial publish, or the device would tear
  # the audio path down mid-boot. It is deliberately not restored across
  # reboots either - a stored wrong value would silently disable AEC on every
  # boot, which is exactly the failure this control exists to diagnose.
  - platform: template
    id: debug_ref_slot
    name: "Debug: AEC reference slot"
    icon: mdi:swap-horizontal
    entity_category: config
    min_value: 0
    max_value: 3
    step: 1
    restore_value: false
    initial_value: 1
    set_action:
      - lambda: id(debug_ref_slot).publish_state(x);
      # Writing the value it already holds must not tear anything down. HA and
      # scripts both re-send the current value freely, and an unguarded restart
      # here kills playback for no reason - which is exactly how the first
      # attempt at measuring this destroyed its own test conditions.
      - if:
          condition:
            lambda: return ((int) x) != id(active_ref_slot);
          then:
            # Release the mic before tearing the bus down - consumers are
            # reference-counted, so stop_and_wait will not stop a stack that
            # mWW is still holding.
            - micro_wake_word.stop:
            - delay: 150ms
            - lambda: |-
                const uint8_t slot = (uint8_t) id(debug_ref_slot).state;
                id(audio_stack).stop_and_wait();
                id(audio_stack).set_tdm_ref_slot(slot);
                id(audio_stack).start();
                id(active_ref_slot) = (int) slot;
                ESP_LOGW("aec", "[DEBUG] reference slot now %u - playback was stopped by the "
                                "bus restart, start audio again before reading AFE levels", slot);
            - delay: 250ms
            - micro_wake_word.start:

  - platform: template
    id: va_gain_factor
    name: "Gain Factor"
    entity_category: config
    optimistic: true
    min_value: 1
    max_value: 64
    step: 1
    restore_value: true
    initial_value: 4
    on_value:
      - lambda: |-
          id(va_mic).set_gain_factor(x);
      - logger.log:
          format: "[MIC] Set gain factor to %.0f"
          args: ["x"]
  # REMOVED: a "Noise Suppression" number driving va.set_noise_suppression_level().
  # That value is only packed into the audio_settings protobuf and sent to HA;
  # it has no device-side effect, and HA's esphome integration now takes
  # audio_settings in handle_pipeline_start() and never reads it again. It never
  # touched the wake word in any case - micro_wake_word runs entirely on-device,
  # upstream of anything the server does. Same story for auto_gain and
  # volume_multiplier in the voice_assistant block, which are left at their
  # defaults rather than exposed as controls that do nothing.
  - platform: template
    id: led_ring_brightness
    name: "LED Ring Brightness"
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0.4
    max_value: 1.0
    step: 0.05
    initial_value: 0.8
    mode: slider
    # Re-run the state machine rather than pushing the new brightness at the
    # light directly: mute deliberately ignores this slider and sits at 12%, and
    # a direct turn_on here would drag it up to the 0.4 minimum until something
    # else refreshed the ring.
    on_value:
      - if:
          condition:
            light.is_on: status_ring
          then:
            - script.execute: control_leds

sensor:
  - platform: template
    id: next_timer
    name: "Next timer"
    update_interval: never
    disabled_by_default: true
    device_class: duration
    unit_of_measurement: s
    icon: "mdi:timer"
    accuracy_decimals: 0

  # Headroom instrumentation. Before adding anything heavy (bluetooth_proxy,
  # another wake word model), take a baseline from these and compare after.
  # "Heap max block" is the one that matters: BLE init fails on the largest
  # contiguous block, not on total free heap, so `free` can look healthy while
  # `block` has already fallen below what the stack needs.
  - platform: debug
    free:
      name: "Heap free"
      entity_category: diagnostic
    block:
      name: "Heap max block"
      entity_category: diagnostic
    min_free:
      name: "Heap min free"
      entity_category: diagnostic
      disabled_by_default: true
    psram:
      name: "PSRAM free"
      entity_category: diagnostic
    loop_time:
      name: "Loop time"
      entity_category: diagnostic

  # Reads the SoC die, which sits well above room temperature and climbs with
  # radio load. Useful as a trend, not as a thermometer.
  - platform: internal_temperature
    name: "Internal temperature"
    entity_category: diagnostic
    disabled_by_default: true

  - platform: wifi_signal
    name: "WiFi signal"
    entity_category: diagnostic
    update_interval: 60s

  # REMOVED: a sound_level sensor tapping i2s_mics. passive: true keeps it from
  # starting the mic, but it still registers a second MicrophoneSource on the
  # same capture, so every audio chunk gets copied and RMS/peak-summed on the
  # mic's delivery path before micro_wake_word sees it. mWW feeds a streaming
  # model - it degrades from dropped or late frames, not just from bad gain -
  # and this was the only change to the audio path in this config, so it is the
  # prime suspect for wake-word detection getting worse. Do not re-add it
  # without A/B-ing detection rate; use "Ambient sound level" from a separate
  # device if you want room-noise telemetry.
  #
  # Kept commented out as a gain-tuning tool. Uncomment, flash, adjust the
  # ES7210 gain_db so that "Peak sound level" reads about -6 to -3 dB while you
  # talk at the device from where you normally stand - that is the ADC's full
  # scale, so 0 dB is already clipping - then comment it out again and reflash.
  # Leaving it in while judging wake-word performance defeats the point of the
  # A/B.
  #
  # - platform: sound_level
  #   microphone:
  #     microphone: clean_mic
  #     channels: 0
  #   passive: true
  #   measurement_duration: 1000ms
  #   rms:
  #     name: "Ambient sound level"
  #     id: ambient_sound_level
  #   peak:
  #     name: "Peak sound level"
  #     id: peak_sound_level

  # Bring-up instruments for the TDM slot mapping. The slot assignments in the
  # esp_audio_stack block are read off the schematic, not measured, and the
  # whole thing is silently useless if they are wrong: AEC would be subtracting
  # a mic from a mic. These answer it empirically.
  #
  # Play music with nobody talking: slot 2 should move and slots 0/1 should not.
  # Then talk with nothing playing: slots 0 and 1 should move and slot 2 should
  # not. Slot 3 should sit still throughout - nothing drives MIC4 on this board.
  #
  # Remove these once the mapping is confirmed; they are four more states a
  # minute into the recorder for no ongoing benefit.
  # All six are gated on the debug_audio switch: the lambda returning an empty
  # optional drops the reading, so nothing publishes while debug is off.
  - platform: esp_audio_stack
    esp_audio_stack_id: audio_stack
    tdm_slot_levels:
      - slot: 0
        name: "Diag: TDM slot 0 (MIC1)"
        entity_category: diagnostic
        filters: &debug_gated
          - lambda: |-
              if (!id(debug_audio).state) return {};
              return x;
      - slot: 1
        name: "Diag: TDM slot 1 (MIC3 = AEC ref)"
        entity_category: diagnostic
        filters: *debug_gated
      - slot: 2
        name: "Diag: TDM slot 2 (MIC2)"
        entity_category: diagnostic
        filters: *debug_gated
      - slot: 3
        name: "Diag: TDM slot 3 (MIC4, unpopulated)"
        entity_category: diagnostic
        filters: *debug_gated

  - platform: esp_afe
    esp_afe_id: afe_processor
    # The pair that tells you whether AEC is doing anything: with the speaker
    # playing, output_rms should sit well below input_volume. About 20 dB below
    # on this board when the reference slot is right; within a couple of dB
    # means the canceller is subtracting the wrong channel.
    input_volume:
      name: "Diag: AFE input volume"
      entity_category: diagnostic
      filters: *debug_gated
    output_rms:
      name: "Diag: AFE output RMS"
      entity_category: diagnostic
      filters: *debug_gated

text_sensor:
  - platform: template
    id: next_timer_name
    name: "Next timer name"
    icon: "mdi:timer"
    disabled_by_default: true
  - platform: template
    name: "Alarm time"
    id: alarm_time
    icon: mdi:bell-ring
  - platform: template
    name: "Current device time"
    id: current_time
    icon: mdi:clock
  - platform: debug
    device:
      name: "Device info"
      entity_category: diagnostic
      disabled_by_default: true
    reset_reason:
      name: "Reset reason"
      entity_category: diagnostic

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
    internal: true
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:restart"

binary_sensor:
  - platform: gpio
    id: key1_button
    name: "Key1"
    pin:
      tca9555: ioexp
      number: 9
      inverted: true
    on_press:
      - media_player.volume_down: external_media_player

  - platform: gpio
    id: key2_button
    name: "Key2"
    pin:
      tca9555: ioexp
      number: 10
      inverted: true
    on_press:
      - media_player.toggle: external_media_player

  - platform: gpio
    id: key3_button
    name: "Key3"
    pin:
      tca9555: ioexp
      number: 11
      inverted: true
    on_press:
      - media_player.volume_up: external_media_player
